<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUNAL Story Studio</title><style>body{font-family:system-ui;margin:0;background:#10131a;color:#fff}main{max-width:1000px;margin:auto;padding:24px}textarea{width:100%;min-height:180px;border-radius:12px;padding:14px;background:#171b24;color:#fff;border:1px solid #343b4d;font-size:16px}button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer;margin:8px 4px 8px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.card{background:#171b24;border:1px solid #343b4d;border-radius:10px;padding:12px}.bar{height:10px;background:#303746;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#64d28a}.mono{font-family:monospace}</style></head><body><main><h1>KUNAL Story Studio</h1><p>Story in. Production plan out. Characters are inferred from the story.</p><textarea id="story" placeholder="Apni story yahan likho..."></textarea><br><button id="plan">Build Story Plan</button><button id="clear">Clear</button><section id="result"></section><h2>Workers</h2><div id="workers" class="grid"></div></main><script>const $=id=>document.getElementById(id);function renderWorkers(){const w=$('workers');w.innerHTML='';for(let i=1;i<=5;i++)w.innerHTML+=`<div class="card"><b>Worker ${i}</b><p id="s${i}">IDLE</p><div class="bar"><div class="fill" id="f${i}"></div></div></div>`}renderWorkers();$('plan').onclick=()=>{const s=$('story').value.trim();if(!s)return alert('Story likho.');const words=s.split(/\\s+/).length;const chars=[...s.matchAll(/(?:\b(?:Raju|Rani|Dadi|Papa|Maa|Farmer|Puppy|Dog|Ladka|Ladki)\b)/gi)].map(x=>x[0]);const unique=[...new Set(chars.map(x=>x.toLowerCase()))];$('result').innerHTML=`<div class="card"><h2>Plan created</h2><p>Story words: ${words}</p><p>Characters detected: ${unique.length?unique.join(', '):'Story Director will infer them in the production backend.'}</p><p class="mono">5 logical workers • automatic retry • verification-first</p></div>`;for(let i=1;i<=5;i++){ $('s'+i).textContent='READY';$('f'+i).style.width='0%';}};$('clear').onclick=()=>{$('story').value='';$('result').innerHTML='';renderWorkers()};</script></body></html>
