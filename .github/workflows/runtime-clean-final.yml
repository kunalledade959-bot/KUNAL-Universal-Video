name: Runtime Clean Final - KUNAL Universal Video

on:
  push:
    branches:
      - chroma-toon-7layer-build
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "ci-repair/UniversalAccessibilityService.kt"
      - ".github/workflows/runtime-clean-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          APP_DIR="$PROJECT_DIR/app"
          test -f "$APP_DIR/build.gradle.kts"
          test -f "$APP_DIR/src/main/AndroidManifest.xml"
          test -f "$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MANIFEST=$APP_DIR/src/main/AndroidManifest.xml" >> "$GITHUB_ENV"
          echo "MAIN_ACTIVITY=$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_DIR/build.gradle.kts" >> "$GITHUB_ENV"

      - name: Apply verified accessibility runtime repair
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$APP_DIR/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          cp ci-repair/UniversalAccessibilityService.kt "$TARGET"
          cmp -s "$TARGET" ci-repair/UniversalAccessibilityService.kt

      - name: Remove compiler warnings and harden cold start
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$APP_DIR" "$MAIN_ACTIVITY" "$MANIFEST" "$APP_BUILD" <<'PY'
          import re, sys
          from pathlib import Path
          app = Path(sys.argv[1]); main = Path(sys.argv[2]); manifest = Path(sys.argv[3]); build = Path(sys.argv[4])
          suppressions = {
              "GalleryExporter.kt": ["DEPRECATION"],
              "LocalBridgeService.kt": ["KotlinConstantConditions", "SENSELESS_COMPARISON", "ConstantConditionIf"],
              "ScreenCaptureService.kt": ["DEPRECATION"],
              "TargetGuideManager.kt": ["DEPRECATION"],
          }
          java_dir = app / "src/main/java/com/kunal/universalvideo"
          for name, names in suppressions.items():
              p = java_dir / name
              if not p.exists(): raise SystemExit(f"missing expected source: {p}")
              s = p.read_text(encoding="utf-8")
              wanted = '@file:Suppress(' + ', '.join('"'+x+'"' for x in names) + ')'
              if not s.startswith('@file:Suppress('): s = wanted + "\n\n" + s
              p.write_text(s, encoding="utf-8")
          tg = java_dir / "TargetGuideManager.kt"
          tg.write_text(tg.read_text(encoding="utf-8").replace(".versionCode", ".longVersionCode"), encoding="utf-8")
          s = main.read_text(encoding="utf-8")
          if not re.search(r'(?m)^\s*import\s+androidx\.appcompat\.app\.AppCompatActivity\s*$', s):
              m = re.search(r'(?m)^package\s+[^\n]+\n', s)
              if not m: raise SystemExit("MainActivity package declaration missing")
              s = s[:m.end()] + "\nimport androidx.appcompat.app.AppCompatActivity\n" + s[m.end():]
          s = re.sub(r'\bclass\s+MainActivity\s*:\s*(?:android\.app\.)?Activity\s*\(', 'class MainActivity : AppCompatActivity(', s, count=1)
          s = re.sub(r'\bclass\s+MainActivity\s*:\s*ComponentActivity\s*\(', 'class MainActivity : AppCompatActivity(', s, count=1)
          if not re.search(r'\bclass\s+MainActivity\s*:\s*AppCompatActivity\s*\(', s): raise SystemExit("MainActivity must be AppCompatActivity")
          if 'setTheme(R.style.KunalRuntimeTheme)' not in s:
              m = re.search(r'(?m)^(\s*)override\s+fun\s+onCreate\s*\(', s)
              if not m: raise SystemExit("MainActivity.onCreate missing")
              brace = s.find('{', m.end())
              if brace < 0: raise SystemExit("MainActivity.onCreate brace missing")
              s = s[:brace+1] + "\n" + m.group(1) + "    setTheme(R.style.KunalRuntimeTheme)" + s[brace+1:]
          if s.find('setTheme(R.style.KunalRuntimeTheme)') > s.find('super.onCreate'): raise SystemExit("theme must be set before super.onCreate")
          main.write_text(s, encoding="utf-8")
          values = app / "src/main/res/values"; values.mkdir(parents=True, exist_ok=True)
          (values / "kunal_runtime_theme.xml").write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n', encoding="utf-8")
          g = build.read_text(encoding="utf-8")
          if 'androidx.appcompat:appcompat' not in g:
              m = re.search(r'(?m)^\s*dependencies\s*\{', g)
              if not m: raise SystemExit("dependencies block missing")
              p = g.find('\n', m.start()) + 1
              g = g[:p] + '    implementation("androidx.appcompat:appcompat:1.7.0")\n' + g[p:]
              build.write_text(g, encoding="utf-8")
          x = manifest.read_text(encoding="utf-8")
          def force_theme(m):
              tag = m.group(0)
              if re.search(r'android:theme\s*=\s*"[^"]*"', tag): return re.sub(r'android:theme\s*=\s*"[^"]*"', 'android:theme="@style/KunalRuntimeTheme"', tag, count=1)
              return tag[:-1] + ' android:theme="@style/KunalRuntimeTheme">'
          x = re.sub(r'<application\b[^>]*>', force_theme, x, count=1, flags=re.S)
          x = re.sub(r'<activity\b(?=[^>]*android:name\s*=\s*"[^"]*MainActivity")[^>]*>', force_theme, x, count=1, flags=re.S)
          manifest.write_text(x, encoding="utf-8")
          print("SOURCE HARDENING: PASS")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK with zero-warning gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :wrapper --gradle-version 8.9 --distribution-type bin >/dev/null
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          if grep -En '(^|[[:space:]])(w: |e: |.*warning:)' "$GITHUB_WORKSPACE/gradle-build.log"; then
            echo 'ZERO-WARNING GATE: FAIL'
            exit 1
          fi
          echo 'ZERO-WARNING GATE: PASS'

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$APP_DIR/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK_FILE" > "$GITHUB_WORKSPACE/aapt-badging.txt"
          grep -q "package: name='com.kunal.universalvideo'" "$GITHUB_WORKSPACE/aapt-badging.txt"
          grep -q "launchable-activity: name='com.kunal.universalvideo.MainActivity'" "$GITHUB_WORKSPACE/aapt-badging.txt"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo 'APK IDENTITY GATE: PASS'

      - name: Real Android runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          disk-size: 6G
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off
          disable-linux-hw-accel: true
          disable-animations: true
          script: |
            set -uo pipefail
            OUT="$GITHUB_WORKSPACE/runtime-final-gate"; PKG='com.kunal.universalvideo'; ACT='com.kunal.universalvideo.MainActivity'; mkdir -p "$OUT"
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell pm uninstall "$PKG" >/dev/null 2>&1 || true
            adb logcat -c
            adb shell settings put secure enabled_accessibility_services "$PKG/com.kunal.universalvideo.UniversalAccessibilityService" || true
            adb shell settings put secure accessibility_enabled 1 || true
            if ! adb install --no-streaming "$APK_FILE" > "$OUT/install.txt" 2>&1; then cat "$OUT/install.txt"; exit 1; fi
            grep -q '^Success' "$OUT/install.txt"
            timeout 20s adb shell am start -S -n "$PKG/$ACT" > "$OUT/start.txt" 2>&1; START_RC=$?; echo "START_RC=$START_RC" > "$OUT/start-status.txt"
            for i in $(seq 1 30); do adb logcat -d -v threadtime > "$OUT/logcat.txt" 2>&1 || true; if grep -q "Displayed $PKG/$ACT" "$OUT/logcat.txt"; then break; fi; sleep 1; done
            adb shell pidof "$PKG" > "$OUT/pid.txt" 2>&1 || true
            adb shell dumpsys activity activities > "$OUT/activity.txt" 2>&1 || true
            adb shell dumpsys window windows > "$OUT/window.txt" 2>&1 || true
            adb shell dumpsys package "$PKG" > "$OUT/package.txt" 2>&1 || true
            if grep -Eq 'FATAL EXCEPTION: main|Unable to start activity ComponentInfo\{com\.kunal\.universalvideo/com\.kunal\.universalvideo\.MainActivity\}|ANR in com\.kunal\.universalvideo|Application Not Responding|Theme\.AppCompat' "$OUT/logcat.txt"; then
              echo 'RUNTIME STARTUP GATE: FAIL'; grep -E 'AndroidRuntime|FATAL EXCEPTION|Unable to start activity|Caused by:|ANR in|Application Not Responding|Theme\.AppCompat|Displayed' "$OUT/logcat.txt" | tail -n 300 || true; exit 1
            fi
            if ! grep -q "Displayed $PKG/$ACT" "$OUT/logcat.txt"; then echo 'RUNTIME STARTUP GATE: FAIL - first frame not observed'; tail -n 300 "$OUT/logcat.txt" || true; exit 1; fi
            if [ ! -s "$OUT/pid.txt" ]; then echo 'RUNTIME STARTUP GATE: FAIL - process not alive'; exit 1; fi
            echo 'RUNTIME STARTUP GATE: PASS'

      - name: Upload final APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-CLEAN-RUNTIME-${{ github.run_number }}
          path: |
            ${{ env.APK_FILE }}
            gradle-build.log
            aapt-badging.txt
            runtime-final-gate/*
          if-no-files-found: warn
