name: Sequence 13 - Final Gallery Export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sequence-test-trigger.txt'
permissions:
  contents: read
jobs:
  sequence-13:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sequence 13
        run: bash .github/scripts/sequence-stage-check.sh 13
