name: Root Cause Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.kt'
      - '.github/scripts/**'
      - '.github/workflows/full-e2e-emulator.yml'
      - '.github/workflows/final-production-user-flow.yml'
      - '.github/workflows/root-cause-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: root-cause-diagnostic-main
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Single Root-Cause Evidence Run
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bootstrap Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --licenses >diagnostic/sdk-licenses.log 2>&1
          PS=(${PIPESTATUS[@]})
          set -e
          cat diagnostic/sdk-licenses.log
          echo "LICENSE_YES_EXIT=${PS[0]}"
          echo "LICENSE_SDKMANAGER_EXIT=${PS[1]}"
          (( PS[1] == 0 ))
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator'
          "$SDKMANAGER" --list_installed > diagnostic/sdk-installed.txt 2>&1
          grep -Fq 'platform-tools' diagnostic/sdk-installed.txt
          grep -Fq 'platforms;android-35' diagnostic/sdk-installed.txt
          grep -Fq 'build-tools;35.0.0' diagnostic/sdk-installed.txt
          grep -Fq 'emulator' diagnostic/sdk-installed.txt

      - name: Capture repository and toolchain state
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          {
            echo "=== UTC ==="; date -u
            echo "=== commit ==="; git rev-parse HEAD
            echo "=== branch ==="; git branch --show-current
            echo "=== status ==="; git status --short
            echo "=== java ==="; java -version
            echo "=== gradle ==="; gradle --version
            echo "=== adb ==="; adb version
            echo "=== emulator ==="; emulator -version
            echo "=== key files ==="
            git ls-files .github/workflows .github/scripts '*.py' '*.kt' | sort
          } > diagnostic/environment.txt 2>&1
          if git cat-file -e a8dab7f10eb14c8888d9ff8cd01398aec4bbfcf2^{commit}; then
            git diff a8dab7f10eb14c8888d9ff8cd01398aec4bbfcf2...HEAD -- \
              '.github/workflows' '.github/scripts' '*.py' '*.kt' > diagnostic/current-vs-known-good.diff 2>&1
            echo "BASELINE_COMPARISON=PASS" >> diagnostic/environment.txt
          else
            echo "BASELINE_COMPARISON=FAIL: known-good commit unavailable in checkout" >> diagnostic/environment.txt
            exit 1
          fi

      - name: Build current production APK without repair loops
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic artifact
          {
            echo "=== preflight_patch.py ==="
            python3 preflight_patch.py
            echo "preflight_exit=$?"
            echo "=== constructor_lifecycle_patch.py ==="
            python3 constructor_lifecycle_patch.py
            echo "constructor_exit=$?"
            echo "=== stage11_hardening_v2.py ==="
            python3 stage11_hardening_v2.py
            echo "stage11_exit=$?"
            echo "=== canonical activity checks ==="
            grep -nE 'queryIntentActivities|CATEGORY_LAUNCHER|getLaunchIntentForPackage|mainHandler|getInstalledApplications' activity_fixed.kt
            echo "=== production builder ==="
            python3 pro_repair_v4.py
            echo "builder_exit=$?"
            echo "=== output files ==="
            ls -lh KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json 2>&1
          } > diagnostic/build.log 2>&1
          if test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; then cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; fi

      - name: Start clean emulator and capture app behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: bash root-cause-diagnostic-emulator.sh

      - name: Create deterministic root-cause report
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          SYSTEM_EVIDENCE=0
          if grep -Eiq 'Application Not Responding: (com\.android\.systemui|system_server)|System UI isn.t responding|DeadSystemException|Fatal signal|Emulator.*crash|qemu.*fatal|adb.*offline|device.*offline' \
              diagnostic/relevant-logcat.txt diagnostic/boundary-results.txt diagnostic/emulator.log 2>/dev/null; then SYSTEM_EVIDENCE=1; fi
          {
            echo "# ROOT CAUSE DIAGNOSTIC"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Known-good baseline: a8dab7f10eb14c8888d9ff8cd01398aec4bbfcf2"
            echo
            echo "## Boundary classification"
            BUILD_RC="$(grep -Eo '^builder_exit=[0-9]+' diagnostic/build.log 2>/dev/null | tail -n1 | cut -d= -f2)"
            if [[ ! "$BUILD_RC" =~ ^0$ ]] || ! test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; then
              echo "FIRST_FAILING_BOUNDARY=BUILD"
              echo "CLASSIFICATION=BUILD_FAILURE"
            elif ! grep -q '^INSTALL_EXIT=0$' diagnostic/boundary-results.txt 2>/dev/null; then
              echo "FIRST_FAILING_BOUNDARY=INSTALL"
              echo "CLASSIFICATION=INSTALL_FAILURE"
            elif ! grep -q '^LAUNCH_EXIT=0$' diagnostic/boundary-results.txt 2>/dev/null || grep -q '^APP_PID=NONE$\|^MAIN_FOCUS=NONE$' diagnostic/boundary-results.txt 2>/dev/null; then
              echo "FIRST_FAILING_BOUNDARY=LAUNCH"
              echo "CLASSIFICATION=LAUNCH_FAILURE"
            elif [ "$SYSTEM_EVIDENCE" -eq 1 ]; then
              echo "FIRST_FAILING_BOUNDARY=SYSTEM"
              echo "CLASSIFICATION=SYSTEM_FAILURE"
            elif ! grep -q '^UI_DUMP_EXIT=0$' diagnostic/boundary-results.txt 2>/dev/null; then
              echo "FIRST_FAILING_BOUNDARY=UI_CAPTURE"
              echo "CLASSIFICATION=UI_FAILURE"
            else
              echo "FIRST_FAILING_BOUNDARY=NONE"
              echo "CLASSIFICATION=PASS"
            fi
            echo
            echo "## Exact observed failure lines"
            grep -E -i 'builder_exit=|install|launch|UI_DUMP_EXIT|FAIL|ERROR|Exception|FATAL|ANR|offline|crash|No target|Accessibility' \
              diagnostic/build.log diagnostic/boundary-results.txt diagnostic/relevant-logcat.txt 2>/dev/null | tail -n 240 || true
            echo
            echo "## Observed evidence"
            test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk && echo "APK_PRESENT=1" || echo "APK_PRESENT=0"
            cat diagnostic/boundary-results.txt 2>/dev/null || echo "BOUNDARY_RESULTS=UNAVAILABLE"
            echo "SYSTEM_ERROR_EVIDENCE=$SYSTEM_EVIDENCE"
            test -s diagnostic/ui-hierarchy.xml && echo "UI_HIERARCHY_CAPTURED=1" || echo "UI_HIERARCHY_CAPTURED=0"
            echo
            echo "## Repair contract"
            echo "Repair only the first failing boundary. Use the exact observed failure lines above as the evidence contract."
            echo "Do not weaken assertions, skip checks, manufacture PASS markers, or classify generic system_server log lines as a system failure."
            echo "If no deterministic failure evidence exists, status is UNVERIFIED, not PASS."
          } > diagnostic/ROOT_CAUSE_REPORT.md

      - name: Upload one complete diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROOT-CAUSE-DIAGNOSTIC-${{ github.run_id }}
          path: |
            diagnostic/
            artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          if-no-files-found: warn
          retention-days: 14
