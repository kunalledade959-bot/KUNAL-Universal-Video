name: Root Cause Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.kt'
      - '.github/scripts/**'
      - '.github/workflows/full-e2e-emulator.yml'
      - '.github/workflows/final-production-user-flow.yml'

permissions:
  contents: read

concurrency:
  group: root-cause-diagnostic-main
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Single Root-Cause Evidence Run
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bootstrap Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          {
            echo "=== sdkmanager --list_installed ==="
            sdkmanager --list_installed || true
            echo "=== licenses ==="
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            echo "=== install ==="
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"
            echo "sdk_install_exit=$?"
          } > diagnostic/sdk-bootstrap.log 2>&1

      - name: Capture repository and toolchain state
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          {
            echo "=== UTC ==="; date -u
            echo "=== commit ==="; git rev-parse HEAD
            echo "=== branch ==="; git branch --show-current
            echo "=== status ==="; git status --short
            echo "=== java ==="; java -version
            echo "=== gradle ==="; gradle --version
            echo "=== adb ==="; adb version
            echo "=== emulator ==="; emulator -version
            echo "=== key files ==="
            git ls-files .github/workflows .github/scripts '*.py' '*.kt' | sort
          } > diagnostic/environment.txt 2>&1
          if git cat-file -e a8dab7f10eb14c8888d9ff8cd01398aec4bbfcf2^{commit}; then
            git diff a8dab7f10eb14c8888d9ff8cd01398aec4bbfcf2...HEAD -- \
              '.github/workflows' '.github/scripts' '*.py' '*.kt' > diagnostic/current-vs-known-good.diff 2>&1
            echo "BASELINE_COMPARISON=PASS" >> diagnostic/environment.txt
          else
            echo "BASELINE_COMPARISON=FAIL: known-good commit unavailable in checkout" >> diagnostic/environment.txt
            exit 1
          fi

      - name: Build current production APK without repair loops
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic artifact
          {
            echo "=== preflight_patch.py ==="
            python3 preflight_patch.py
            echo "preflight_exit=$?"
            echo "=== canonical activity checks ==="
            grep -nE 'queryIntentActivities|CATEGORY_LAUNCHER|getLaunchIntentForPackage|mainHandler|getInstalledApplications' activity_fixed.kt
            echo "=== production builder ==="
            python3 pro_repair_v4.py
            echo "builder_exit=$?"
            echo "=== output files ==="
            ls -lh KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json 2>&1
          } > diagnostic/build.log 2>&1
          if test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; then cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; fi

      - name: Start clean emulator and capture app behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set +e
            mkdir -p diagnostic
            exec > >(tee diagnostic/emulator-run.log) 2>&1
            INSTALL_EXIT=99
            LAUNCH_EXIT=99
            APP_PID=""
            MAIN_FOCUS=""
            UI_DUMP_EXIT=99
            echo "=== emulator ready ==="
            adb devices -l
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell settings get global animator_duration_scale
            adb shell settings put global bluetooth_on 0 || true
            adb shell svc bluetooth disable || true
            adb shell am force-stop com.android.bluetooth || true
            echo "=== install ==="
            if test -s artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; then
              adb install -r artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
              INSTALL_EXIT=$?
            else
              echo "APK_MISSING_BEFORE_INSTALL=1"
              INSTALL_EXIT=98
            fi
            echo "install_exit=$INSTALL_EXIT"
            echo "=== package ==="
            adb shell dumpsys package com.kunal.universalvideo > diagnostic/package.txt
            echo "=== launch ==="
            if [ "$INSTALL_EXIT" -eq 0 ]; then
              adb shell am force-stop com.kunal.universalvideo
              adb shell pm clear com.kunal.universalvideo
              adb shell monkey -p com.kunal.universalvideo -c android.intent.category.LAUNCHER 1
              LAUNCH_EXIT=$?
            fi
            echo "launch_exit=$LAUNCH_EXIT"
            sleep 8
            echo "=== focus ==="
            adb shell dumpsys activity activities | tee diagnostic/activity-focus.txt | grep -E 'mResumedActivity|mFocusedApp' || true
            adb shell dumpsys window windows | tee diagnostic/window-focus.txt | grep -E 'mCurrentFocus|mFocusedApp' || true
            MAIN_FOCUS=$(cat diagnostic/activity-focus.txt diagnostic/window-focus.txt 2>/dev/null | grep -E 'com.kunal.universalvideo/.MainActivity|com.kunal.universalvideo.*MainActivity' | head -1)
            echo "main_focus=${MAIN_FOCUS:-NONE}"
            echo "=== process ==="
            APP_PID=$(adb shell pidof com.kunal.universalvideo 2>/dev/null | tr -d '\r\n')
            echo "app_pid=${APP_PID:-NONE}"
            echo "=== UI hierarchy ==="
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1
            UI_DUMP_EXIT=$?
            echo "ui_dump_exit=$UI_DUMP_EXIT"
            adb shell cat /sdcard/window.xml > diagnostic/ui-hierarchy.xml 2>&1 || true
            echo "=== screenshot ==="
            adb exec-out screencap -p > diagnostic/screenshot.png
            echo "=== crash/anr ==="
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|ANR in|Application Not Responding|DeadSystemException|system_server|com.android.systemui|com.android.bluetooth|com.kunal.universalvideo' > diagnostic/relevant-logcat.txt || true
            adb logcat -d -v threadtime > diagnostic/full-logcat.txt
            echo "=== final state ==="
            adb shell dumpsys activity activities > diagnostic/activity.txt
            adb shell dumpsys window windows > diagnostic/window.txt
            adb shell dumpsys meminfo com.kunal.universalvideo > diagnostic/meminfo.txt 2>&1 || true
            {
              echo "INSTALL_EXIT=$INSTALL_EXIT"
              echo "LAUNCH_EXIT=$LAUNCH_EXIT"
              echo "APP_PID=${APP_PID:-NONE}"
              echo "MAIN_FOCUS=${MAIN_FOCUS:-NONE}"
              echo "UI_DUMP_EXIT=$UI_DUMP_EXIT"
            } > diagnostic/boundary-results.txt
            if [ "$INSTALL_EXIT" -ne 0 ] || [ "$LAUNCH_EXIT" -ne 0 ] || [ -z "$APP_PID" ] || [ -z "$MAIN_FOCUS" ] || [ "$UI_DUMP_EXIT" -ne 0 ]; then
              exit 1
            fi

      - name: Create deterministic root-cause report
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          SYSTEM_EVIDENCE=0
          grep -q 'com.android.systemui\|system_server\|com.android.bluetooth\|DeadSystemException\|Application Not Responding\|ANR in' diagnostic/relevant-logcat.txt 2>/dev/null && SYSTEM_EVIDENCE=1
          {
            echo "# ROOT CAUSE DIAGNOSTIC"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Known-good baseline: a8dab7f10eb14c8888d9ff8cd01398aec4bbfcf2"
            echo
            echo "## Boundary classification"
            if ! test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk; then
              echo "FIRST_FAILING_BOUNDARY=BUILD"
              echo "CLASSIFICATION=BUILD_FAILURE"
            elif ! grep -q '^INSTALL_EXIT=0$' diagnostic/boundary-results.txt 2>/dev/null; then
              echo "FIRST_FAILING_BOUNDARY=INSTALL"
              echo "CLASSIFICATION=INSTALL_FAILURE"
            elif ! grep -q '^LAUNCH_EXIT=0$' diagnostic/boundary-results.txt 2>/dev/null || grep -q '^APP_PID=NONE$\|^MAIN_FOCUS=NONE$' diagnostic/boundary-results.txt 2>/dev/null; then
              echo "FIRST_FAILING_BOUNDARY=LAUNCH"
              echo "CLASSIFICATION=LAUNCH_FAILURE"
            elif [ "$SYSTEM_EVIDENCE" -eq 1 ]; then
              echo "FIRST_FAILING_BOUNDARY=SYSTEM"
              echo "CLASSIFICATION=SYSTEM_FAILURE"
            elif ! grep -q '^UI_DUMP_EXIT=0$' diagnostic/boundary-results.txt 2>/dev/null; then
              echo "FIRST_FAILING_BOUNDARY=UI_CAPTURE"
              echo "CLASSIFICATION=UI_FAILURE"
            else
              echo "FIRST_FAILING_BOUNDARY=NONE"
              echo "CLASSIFICATION=PASS"
            fi
            echo
            echo "## Observed evidence"
            test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk && echo "APK_PRESENT=1" || echo "APK_PRESENT=0"
            cat diagnostic/boundary-results.txt 2>/dev/null || echo "BOUNDARY_RESULTS=UNAVAILABLE"
            echo "SYSTEM_ERROR_EVIDENCE=$SYSTEM_EVIDENCE"
            test -s diagnostic/ui-hierarchy.xml && echo "UI_HIERARCHY_CAPTURED=1" || echo "UI_HIERARCHY_CAPTURED=0"
            echo
            echo "## Rule"
            echo "This run performs diagnosis only. It does not invoke AutoRepair, Final Production User Flow, or any automatic code repair."
            echo "The first failing boundary and its complete evidence are the basis for the next root-cause change."
          } > diagnostic/ROOT_CAUSE_REPORT.md

      - name: Upload one complete diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROOT-CAUSE-DIAGNOSTIC-${{ github.run_id }}
          path: |
            diagnostic/
            artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          if-no-files-found: warn
          retention-days: 14
