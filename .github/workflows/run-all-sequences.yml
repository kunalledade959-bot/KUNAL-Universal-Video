name: Run All Systems Independently

# Intentionally manual-only. A code push must never fan out into 13 sequence runs.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch 13 independent system runs in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 1 13); do
            echo "DISPATCH system-${n} (sequence-${n}.yml)"
            gh workflow run "sequence-${n}.yml" --repo "$REPO" --ref main &
          done
          wait
          echo "ALL_13_INDEPENDENT_SYSTEM_RUN_REQUESTS_SENT"
