name: Production Hardening Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "stage_gate.kt"
      - "activity_fixed.kt"
      - "preflight_patch.py"
      - "mobile_connection_real_fix.py"
      - "pro_repair_v3.py"
      - "KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
      - ".github/workflows/production-hardening.yml"

concurrency:
  group: kunal-universal-video-production-hardening
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Validate hardening contract
        shell: bash
        run: |
          set -euo pipefail
          test -s HARDENING_PLAN.md
          python3 -m py_compile preflight_patch.py mobile_connection_real_fix.py pro_repair_v3.py
          grep -q 'class StageGate' stage_gate.kt
          grep -q 'schema", 2' stage_gate.kt
          grep -q 'process_recovery' stage_gate.kt
          grep -q 'commit()' stage_gate.kt

      - name: Apply deterministic project patches
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          python3 mobile_connection_real_fix.py
          python3 -m py_compile pro_repair_v3.py

      - name: Build production APK
        shell: bash
        run: |
          set -euo pipefail
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          sha256sum KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee APK_SHA256.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-evidence
          path: |
            KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log
            APK_SHA256.txt
          if-no-files-found: ignore
