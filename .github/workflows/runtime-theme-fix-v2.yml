name: Runtime Theme Fix V2 - KUNAL Universal Video

on:
  push:
    paths:
      - ".github/workflows/runtime-theme-fix-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime-fixed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract proven app
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          APP_DIR="$PROJECT_DIR/app"
          test -f "$APP_DIR/build.gradle.kts"
          test -f "$APP_DIR/src/main/AndroidManifest.xml"
          test -f "$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MANIFEST=$APP_DIR/src/main/AndroidManifest.xml" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_DIR/build.gradle.kts" >> "$GITHUB_ENV"
          echo "MAIN_ACTIVITY=$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt" >> "$GITHUB_ENV"

      - name: Install canonical AccessibilityService
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$APP_DIR/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          test -s ci-repair/UniversalAccessibilityService.kt
          test -f "$TARGET"
          cp ci-repair/UniversalAccessibilityService.kt "$TARGET"
          cmp -s ci-repair/UniversalAccessibilityService.kt "$TARGET"

      - name: Repair actual startup layout contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          app = Path(os.environ['APP_DIR'])
          layout_dir = app / 'src/main/res'
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          repaired = []
          checked = 0
          for path in layout_dir.rglob('*.xml'):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              root = tree.getroot()
              changed = False
              for parent in list(root.iter()):
                  if local(parent.tag) not in {'ScrollView', 'HorizontalScrollView', 'NestedScrollView'}:
                      continue
                  children = list(parent)
                  # ScrollView-family containers may contain exactly one direct View child.
                  if len(children) <= 1:
                      continue
                  wrapper = ET.Element('LinearLayout')
                  wrapper.set(f'{{{android}}}layout_width', 'match_parent')
                  wrapper.set(f'{{{android}}}layout_height', 'wrap_content')
                  wrapper.set(f'{{{android}}}orientation', 'vertical')
                  for child in children:
                      parent.remove(child)
                      wrapper.append(child)
                  parent.append(wrapper)
                  changed = True
              if changed:
                  tree.write(path, encoding='utf-8', xml_declaration=True)
                  repaired.append(str(path))
              checked += 1

          # Startup layout must be repaired if it is malformed; do not silently ship it.
          startup = list(layout_dir.rglob('activity_main.xml'))
          if not startup:
              raise SystemExit('activity_main.xml not found')
          print(f'Checked {checked} layout XML files')
          print('Repaired ScrollView-family layouts:')
          for p in repaired:
              print(p)

          # Independent post-repair audit: no ScrollView-family node may have >1 direct child.
          violations = []
          for path in layout_dir.rglob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for node in root.iter():
                  if local(node.tag) in {'ScrollView', 'HorizontalScrollView', 'NestedScrollView'} and len(list(node)) > 1:
                      violations.append(f'{path}:{local(node.tag)}:{len(list(node))}')
          if violations:
              raise SystemExit('INVALID ScrollView structure remains: ' + '; '.join(violations))
          print('PASS: no ScrollView-family container has multiple direct children')
          PY

      - name: Apply permanent runtime theme contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          app=Path(os.environ['APP_DIR'])
          manifest=Path(os.environ['MANIFEST'])
          build=Path(os.environ['APP_BUILD'])
          main=Path(os.environ['MAIN_ACTIVITY'])
          theme='@style/KunalRuntimeTheme'

          s=main.read_text(encoding='utf-8')
          if not re.search(r'\bimport\s+androidx\.appcompat\.app\.AppCompatActivity\b',s):
              s=re.sub(r'(?m)^package\s+[^\n]+\n',lambda m:m.group(0)+'\nimport androidx.appcompat.app.AppCompatActivity\n',s,count=1)
          s=re.sub(r'\bclass\s+MainActivity\s*:\s*(?:android\.app\.)?Activity\s*\(', 'class MainActivity : AppCompatActivity(', s, count=1)
          s=re.sub(r'\bclass\s+MainActivity\s*:\s*ComponentActivity\s*\(', 'class MainActivity : AppCompatActivity(', s, count=1)
          if not re.search(r'class\s+MainActivity[^\n]*:\s*AppCompatActivity\s*\(',s):
              raise SystemExit('MainActivity is not AppCompatActivity after repair')
          if 'setTheme(R.style.KunalRuntimeTheme)' not in s:
              m=re.search(r'(?m)^(\s*)super\.onCreate\s*\(',s)
              if not m:
                  raise SystemExit('MainActivity super.onCreate() not found')
              indent=m.group(1)
              s=s[:m.start()]+indent+'setTheme(R.style.KunalRuntimeTheme)\n'+s[m.start():]
          if s.index('setTheme(R.style.KunalRuntimeTheme)') > s.index('super.onCreate'):
              raise SystemExit('Runtime theme guard is after super.onCreate')
          main.write_text(s,encoding='utf-8')

          g=build.read_text(encoding='utf-8')
          if 'androidx.appcompat:appcompat' not in g:
              m=re.search(r'(?m)^\s*dependencies\s*\{',g)
              if not m: raise SystemExit('dependencies block not found')
              p=g.find('\n',m.start())+1
              g=g[:p]+'    implementation("androidx.appcompat:appcompat:1.7.0")\n'+g[p:]
              build.write_text(g,encoding='utf-8')

          values=app/'src/main/res/values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'kunal_runtime_theme.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n''',encoding='utf-8')

          x=manifest.read_text(encoding='utf-8')
          def add_theme(m):
              tag=m.group(0)
              if re.search(r'android:theme\s*=\s*"[^"]*"',tag):
                  return re.sub(r'android:theme\s*=\s*"[^"]*"',f'android:theme="{theme}"',tag,count=1)
              return tag[:-1]+f' android:theme="{theme}">'
          x=re.sub(r'<application\b[^>]*>',add_theme,x,count=1,flags=re.S)
          activity=r'<activity\b(?=[^>]*android:name\s*=\s*"[^"]*MainActivity")[^>]*>'
          if not re.search(activity,x,re.S): raise SystemExit('MainActivity manifest entry not found')
          x=re.sub(activity,add_theme,x,count=1,flags=re.S)
          manifest.write_text(x,encoding='utf-8')

          ms=main.read_text(encoding='utf-8')
          assert re.search(r'class\s+MainActivity[^\n]*:\s*AppCompatActivity\s*\(',ms)
          assert ms.index('setTheme(R.style.KunalRuntimeTheme)') < ms.index('super.onCreate')
          assert 'androidx.appcompat:appcompat' in build.read_text(encoding='utf-8')
          assert x.count('@style/KunalRuntimeTheme') >= 2
          print('PASS: runtime AppCompat theme is enforced before Activity startup')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle :wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee "$GITHUB_WORKSPACE/gradle-wrapper.log"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Independent APK contract verification
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$APP_DIR/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo 'PASS: APK exists and archive integrity is valid'

      - name: Upload runtime-fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK-runtime-fixed-v3
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "runtime-v3-${GITHUB_RUN_NUMBER}" "$APK_FILE" --title "KUNAL Universal Video Runtime Fixed V3 #${GITHUB_RUN_NUMBER}" --notes "Fixed actual runtime crash: ScrollView-family layout now has exactly one direct child; AppCompat startup theme is enforced before MainActivity.onCreate; source and APK integrity checks passed."

      - name: Failure evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci-results
          {
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Status: ${{ job.status }}"
            echo "Project: ${PROJECT_DIR:-unknown}"
            echo "App: ${APP_DIR:-unknown}"
            echo
            grep -E -i '(FAILURE:|What went wrong:|Execution failed|Could not resolve|Unresolved reference|error:|Caused by:|Exception|manifest merger failed|ScrollView)' gradle-build.log 2>/dev/null | tail -n 200 || true
            tail -n 200 gradle-build.log 2>/dev/null || true
          } > ci-results/runtime-v3-diagnosis.md

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v3-diagnostics-${{ github.run_number }}
          path: |
            ci-results/runtime-v3-diagnosis.md
            gradle-build.log
            gradle-wrapper.log
          if-no-files-found: ignore
