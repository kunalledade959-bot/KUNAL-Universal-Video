name: Autonomous APK Doctor

on:
  workflow_run:
    workflows:
      - Runtime Crash Diagnostic
      - Full E2E Emulator Gate
      - Final Production User Flow Gate
      - Forensic Bug Hunt V2
      - Ultra Pro Coding Lock
      - Root Cause Diagnostic
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kunal-universal-video-ai-doctor
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  doctor:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare complete failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ai-evidence/trigger-run
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Triggering workflow run: $RUN_ID" | tee ai-evidence/trigger.txt
            echo "Triggering workflow: ${{ github.event.workflow_run.name }}" | tee -a ai-evidence/trigger.txt
            echo "Triggering conclusion: ${{ github.event.workflow_run.conclusion }}" | tee -a ai-evidence/trigger.txt
            echo "Triggering head SHA: ${{ github.event.workflow_run.head_sha }}" | tee -a ai-evidence/trigger.txt
            set +e
            gh run download "$RUN_ID" -D ai-evidence/trigger-run
            DOWNLOAD_STATUS=$?
            set -e
            echo "ARTIFACT_DOWNLOAD_STATUS=$DOWNLOAD_STATUS" > ai-evidence/artifact-download-status.txt
            set +e
            gh run view "$RUN_ID" --log-failed > ai-evidence/trigger-failed-log.txt 2>&1
            LOG_STATUS=$?
            set -e
            echo "FAILED_LOG_CAPTURE_STATUS=$LOG_STATUS" > ai-evidence/failed-log-status.txt
            if [[ "$LOG_STATUS" != "0" ]]; then
              echo "Failed-log capture was unavailable; inspect run metadata and artifacts instead." >> ai-evidence/trigger-failed-log.txt
            fi
          else
            printf '%s\n' 'Manual autonomous repair. Inspect current repository and run the real gates.' > ai-evidence/manual-trigger.txt
          fi
          find ai-evidence -maxdepth 8 -type f -print | sort > ai-evidence/evidence-inventory.txt

      - name: Install Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Iterative root-cause repair loop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u -o pipefail
          MAX_ITERATIONS=8
          PASS=0
          mkdir -p ai-evidence/iterations
          for ITERATION in $(seq 1 "$MAX_ITERATIONS"); do
            mkdir -p "ai-evidence/iterations/$ITERATION"
            copilot --autopilot --yolo --max-autopilot-continues 12 -p "
            You are the senior production Android repair engineer for KUNAL Universal Video.
            Repair only evidence-backed root causes. Never weaken tests, fake PASS, skip stages, or hide errors.
            Read ALL ai-evidence, especially the triggering workflow evidence, the current git diff,
            production build/repair scripts, activity_fixed.kt, StageGate, all repair scripts,
            self-healing-gate.sh, full-e2e-emulator.sh and final-production-user-flow.sh.

            Trace the FIRST proven root cause through the complete dependency chain before editing.
            Distinguish application defects from test-contract, emulator/ADB, build/configuration,
            and workflow-infrastructure failures. Do not repair a downstream symptom when the
            evidence proves an upstream cause.

            For final user-flow failures, trace the complete dependency chain from visible UI through
            MainActivity, launcher/package discovery, Spinner adapter/selection state, SharedPreferences
            persistence, bridge connection, AccessibilityService targetPackage/foreground state, and target launch.
            For production-flow failures beyond Stage 3, trace the affected stage through its real input,
            state transition, output artifact, and downstream consumer. Preserve the real 13-stage behavior.

            HARD RULES:
            - Never weaken, delete, skip, bypass, or rewrite an assertion to make CI green.
            - Never manufacture e2e-PASS.txt or PASS markers.
            - Never hide real errors with || true unless the command is diagnostic-only and cannot affect a gate.
            - Never replace real app behavior with a fake test-only success path.
            - Preserve target selection/persistence, Accessibility, MediaProjection, TTS/audio,
              assembly, verification, gallery behavior, and the 13-stage state machine.
            - Do not touch secrets or credentials.
            - Make only changes required for the proven root cause.
            - Do not commit or push. The controller does that only after verification.

            After every repair, run static checks and the authoritative self-healing-gate.sh.
            Then run final-production-user-flow.sh as a separate production contract. Do not treat
            full E2E structural PASS as final production certification.
            Record diagnosis, dependency-chain evidence, exact changed files, checks and remaining
            blockers in ai-evidence/iterations/$ITERATION/repair.md.
            " > "ai-evidence/iterations/$ITERATION/copilot.log" 2>&1
            STATUS=$?
            echo "COPILOT_STATUS=$STATUS" > "ai-evidence/iterations/$ITERATION/result.txt"
            git diff --check > "ai-evidence/iterations/$ITERATION/git-diff-check.txt" 2>&1 || true
            git status --short > "ai-evidence/iterations/$ITERATION/git-status.txt" 2>&1 || true

            rm -f e2e-PASS.txt
            set +e
            bash .github/scripts/self-healing-gate.sh > "ai-evidence/iterations/$ITERATION/gate.log" 2>&1
            GATE_STATUS=$?
            set -e
            echo "GATE_STATUS=$GATE_STATUS" >> "ai-evidence/iterations/$ITERATION/result.txt"
            cp e2e-*.txt "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            cp e2e-*.xml "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            cp e2e-*.log "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            if [[ "$GATE_STATUS" != "0" || ! -f e2e-PASS.txt ]]; then
              continue
            fi

            set +e
            bash .github/scripts/final-production-user-flow.sh > "ai-evidence/iterations/$ITERATION/final-production-user-flow.log" 2>&1
            FLOW_STATUS=$?
            set -e
            echo "FINAL_PRODUCTION_FLOW_STATUS=$FLOW_STATUS" >> "ai-evidence/iterations/$ITERATION/result.txt"
            cp FINAL_PRODUCTION_USER_FLOW_*.txt "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            if [[ "$FLOW_STATUS" == "0" ]]; then
              PASS=1
              break
            fi
          done
          [[ "$PASS" == "1" ]] || { echo 'AUTOREPAIR_EXHAUSTED'; exit 1; }

      - name: Final integrity and publish
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip
          test -s e2e-PASS.txt
          grep -q 'PASS' e2e-PASS.txt
          test -f FINAL_PRODUCTION_USER_FLOW_PASS.txt
          git diff --check
          git config user.name 'kunalledade959-bot'
          git config user.email 'kunalledade959-bot@users.noreply.github.com'
          git add KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip activity_fixed.kt stage11_hardening_v2.py preflight_patch.py constructor_lifecycle_patch.py pro_repair_v3.py .github/scripts .github/workflows ai-evidence
          if ! git diff --cached --quiet; then
            git commit -m 'fix: autonomously repair and verify production Android system'
            git push origin main
          fi

      - name: Upload autonomous doctor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-AI-doctor-evidence
          path: ai-evidence/
          if-no-files-found: ignore
          retention-days: 30
