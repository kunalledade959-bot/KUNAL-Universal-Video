name: Autonomous APK Doctor

on:
  workflow_run:
    workflows:
      - Runtime Crash Diagnostic
      - Full E2E Emulator Gate
      - Final Production User Flow Gate
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kunal-universal-video-ai-doctor
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  copilot-requests: write

jobs:
  doctor:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare complete failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ai-evidence
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Triggering workflow run: $RUN_ID" | tee ai-evidence/trigger.txt
            gh run download "$RUN_ID" -n full-e2e-emulator-evidence -D ai-evidence/full-e2e || true
            gh run download "$RUN_ID" -n KUNAL-Universal-Video-runtime-evidence -D ai-evidence/runtime || true
            gh run download "$RUN_ID" -n KUNAL-Universal-Video-final-user-flow-evidence -D ai-evidence/final-user-flow || true
            gh run view "$RUN_ID" --log-failed > ai-evidence/trigger-failed-log.txt 2>&1 || true
          else
            printf '%s\n' 'Manual autonomous repair. Inspect current repository and run the real gate.' > ai-evidence/manual-trigger.txt
          fi
          find ai-evidence -type f -maxdepth 6 -print | sort || true

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Iterative root-cause repair loop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u -o pipefail
          MAX_ITERATIONS=8
          PASS=0
          mkdir -p ai-evidence/iterations
          for ITERATION in $(seq 1 "$MAX_ITERATIONS"); do
            mkdir -p "ai-evidence/iterations/$ITERATION"
            copilot --autopilot --yolo --max-autopilot-continues 12 -p "
            You are the senior production Android repair engineer for KUNAL Universal Video.
            Repair only evidence-backed root causes. Never weaken tests, fake PASS, skip stages, or hide errors.
            Read ALL ai-evidence, especially final-user-flow evidence, the current git diff, the production ZIP,
            activity_fixed.kt, StageGate, all repair scripts, self-healing-gate.sh, full-e2e-emulator.sh and
            final-production-user-flow.sh.

            For final user-flow failures, trace the complete dependency chain from visible UI through MainActivity,
            package-manager installed-app enumeration, Spinner adapter/selection state, SharedPreferences persistence,
            bridge connection, AccessibilityService targetPackage/foreground state, and target launch. Repair the
            product at the actual root, not the assertion. If the evidence proves an emulator/SystemUI/ADB problem,
            repair infrastructure instead and do not alter app behavior to compensate.

            After every repair, run static checks and the authoritative self-healing-gate.sh. Then continue to the
            next real blocker until the gate passes or the bounded iteration limit is reached. Record diagnosis and
            exact changed files in ai-evidence/iterations/$ITERATION/repair.md.
            " > "ai-evidence/iterations/$ITERATION/copilot.log" 2>&1
            STATUS=$?
            echo "COPILOT_STATUS=$STATUS" > "ai-evidence/iterations/$ITERATION/result.txt"
            git diff --check > "ai-evidence/iterations/$ITERATION/git-diff-check.txt" 2>&1 || true
            git status --short > "ai-evidence/iterations/$ITERATION/git-status.txt" 2>&1 || true
            rm -f e2e-PASS.txt
            set +e
            bash .github/scripts/self-healing-gate.sh > "ai-evidence/iterations/$ITERATION/gate.log" 2>&1
            GATE_STATUS=$?
            set -e
            echo "GATE_STATUS=$GATE_STATUS" >> "ai-evidence/iterations/$ITERATION/result.txt"
            cp e2e-*.txt "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            cp e2e-*.xml "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            cp e2e-*.log "ai-evidence/iterations/$ITERATION/" 2>/dev/null || true
            if [[ "$GATE_STATUS" == "0" && -f e2e-PASS.txt ]]; then
              PASS=1
              break
            fi
          done
          [[ "$PASS" == "1" ]] || { echo 'AUTOREPAIR_EXHAUSTED'; exit 1; }

      - name: Final integrity and publish
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip
          test -s e2e-PASS.txt
          grep -q 'PASS' e2e-PASS.txt
          git diff --check
          git config user.name 'kunalledade959-bot'
          git config user.email 'kunalledade959-bot@users.noreply.github.com'
          git add KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip activity_fixed.kt stage11_hardening_v2.py preflight_patch.py constructor_lifecycle_patch.py pro_repair_v3.py .github/scripts .github/workflows ai-evidence
          if ! git diff --cached --quiet; then
            git commit -m 'fix: autonomously repair and verify production Android system'
            git push origin main
          fi

      - name: Upload autonomous doctor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-AI-doctor-evidence
          path: ai-evidence/
          if-no-files-found: ignore
