name: Full System Exhaustive Audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Audit scope'
        required: false
        default: 'FULL-A-TO-Z'
  push:
    branches: [main]
    paths:
      - '.github/one-shot/full-system-exhaustive-audit.trigger'

permissions:
  contents: read

jobs:
  exhaustive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        if: always()
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        id: deps
        if: always()
        continue-on-error: true
        shell: bash
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Collect complete A-to-Z evidence
        id: audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [[ -f .github/scripts/full-system-exhaustive-audit.sh ]]; then
            chmod +x .github/scripts/full-system-exhaustive-audit.sh
            .github/scripts/full-system-exhaustive-audit.sh
          else
            printf 'AUDIT_BOOTSTRAP_FAILURE: missing audit script\n' > FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
            printf 'AUDIT_BOOTSTRAP_FAILURE: missing audit script\n' > FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt
          fi
          rc=$?
          printf '\nBOOTSTRAP_STATUS checkout=%s python=%s dependencies=%s audit_rc=%s\n' '${{ steps.checkout.outcome }}' '${{ steps.python.outcome }}' '${{ steps.deps.outcome }}' "$rc" >> FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
          exit 0

      - name: Guarantee reports
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          [[ -f FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt ]] || printf 'AUDIT REPORT WAS NOT CREATED\n' > FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
          [[ -f FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt ]] || printf 'AUDIT ERROR FILE WAS NOT CREATED\n' > FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt
          {
            echo
            echo '===== WORKFLOW STEP OUTCOMES ====='
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "python=${{ steps.python.outcome }}"
            echo "dependencies=${{ steps.deps.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo '===== END WORKFLOW STEP OUTCOMES ====='
          } >> FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
          exit 0

      - name: Print complete evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo '===== FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt ====='
          cat FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt || true
          echo '===== FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt ====='
          cat FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt || true
          exit 0

      - name: Upload complete evidence bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: full-system-exhaustive-audit-${{ github.run_number }}
          path: |
            FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
            FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verdict without aborting collection job
        if: always()
        shell: bash
        run: |
          if grep -q 'FINAL_VERDICT=FAIL_STATIC_EXHAUSTIVE' FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt 2>/dev/null; then
            echo 'FINAL VERDICT: FAIL_STATIC_EXHAUSTIVE'
          else
            echo 'FINAL VERDICT: PASS_STATIC_EXHAUSTIVE'
          fi
          echo 'Collection completed. This step never aborts the evidence job.'
          exit 0
