name: Full System Exhaustive Audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Audit scope'
        required: false
        default: 'FULL-A-TO-Z'
  push:
    branches: [main]
    paths:
      - '.github/one-shot/full-system-exhaustive-audit.trigger'

permissions:
  contents: read

jobs:
  exhaustive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        id: deps
        shell: bash
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Materialize packaged Android project for inspection
        id: materialize_android
        shell: bash
        run: |
          set +e
          if [[ -d android/app/src/main ]] && [[ -f android/app/src/main/AndroidManifest.xml ]]; then
            echo 'ANDROID_SOURCE=repository-tree'
            exit 0
          fi
          for archive in KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT.zip; do
            if [[ -f "$archive" ]] && command -v unzip >/dev/null 2>&1; then
              rm -rf .audit-android
              mkdir -p .audit-android
              unzip -q "$archive" -d .audit-android || continue
              manifest=$(find .audit-android -type f -name AndroidManifest.xml -path '*/app/src/main/*' | head -n 1)
              if [[ -n "$manifest" ]]; then
                appdir="${manifest%/src/main/AndroidManifest.xml}"
                androidroot="${appdir%/app}"
                rm -rf android
                cp -a "$androidroot" android
                echo "ANDROID_SOURCE=archive:$archive"
                exit 0
              fi
            fi
          done
          echo 'ANDROID_SOURCE=NOT_FOUND'
          exit 0

      - name: Run static exhaustive collection
        id: audit
        shell: bash
        run: |
          set +e
          chmod +x .github/scripts/full-system-exhaustive-audit.sh
          .github/scripts/full-system-exhaustive-audit.sh
          rc=$?
          printf '\nBOOTSTRAP_STATUS checkout=%s python=%s dependencies=%s materialize_android=%s audit_rc=%s\n' '${{ steps.checkout.outcome }}' '${{ steps.python.outcome }}' '${{ steps.deps.outcome }}' '${{ steps.materialize_android.outcome }}' "$rc" >> FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
          exit 0

      - name: Run 10,000-iteration deterministic invariant stress
        id: stress
        shell: bash
        run: |
          python .github/scripts/ten-thousand-invariant-stress.py | tee TEN_THOUSAND_INVARIANT_STRESS.txt

      - name: Publish authoritative verdict
        if: always()
        shell: bash
        run: |
          static_fail=0
          grep -q 'FINAL_VERDICT=FAIL_STATIC_EXHAUSTIVE' FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt 2>/dev/null && static_fail=1
          stress_pass=0
          grep -q '10K_INVARIANT_STRESS_PASS iterations=10000' TEN_THOUSAND_INVARIANT_STRESS.txt 2>/dev/null && stress_pass=1
          echo "STATIC_AUDIT_FAIL=$static_fail"
          echo "TEN_K_STRESS_PASS=$stress_pass"
          if (( static_fail == 0 && stress_pass == 1 )); then
            echo 'FINAL_VERDICT=PASS_STATIC_AND_DETERMINISTIC_STRESS'
          else
            echo 'FINAL_VERDICT=FAIL_STATIC_OR_DETERMINISTIC_STRESS'
            exit 1
          fi

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-exhaustive-audit-${{ github.run_number }}
          path: |
            FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt
            FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt
            TEN_THOUSAND_INVARIANT_STRESS.txt
          if-no-files-found: warn
          retention-days: 30
