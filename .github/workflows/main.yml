name: KUNAL Universal Video - 13 Sequential Gates

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "pro_repair_v3.py"
      - "preflight_patch.py"
      - ".github/scripts/emulator-smoke.sh"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kunal-universal-video-13-gates
  cancel-in-progress: false

jobs:
  gate-01-checkout:
    name: "01 - Source checkout"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip
          test -s preflight_patch.py
          test -s pro_repair_v3.py
          test -s .github/scripts/emulator-smoke.sh
          echo "GATE_01_PASS"

  gate-02-toolchain:
    name: "02 - Android toolchain"
    needs: gate-01-checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v3
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"
          java -version
          gradle --version
          adb version
          echo "GATE_02_PASS"

  gate-03-preflight:
    name: "03 - Deterministic preflight"
    needs: gate-02-toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          test -s KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip
          echo "GATE_03_PASS"

  gate-04-build:
    name: "04 - Autonomous repair and build"
    needs: gate-03-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          echo "GATE_04_PASS"
      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: gate04-apk
          path: |
            KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log

  gate-05-static:
    name: "05 - Static artifact verification"
    needs: gate-04-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate04-apk
          path: artifact
      - name: Verify APK and report
        shell: bash
        run: |
          set -euo pipefail
          test -s artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          sha256sum artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee APK_SHA256.txt
          echo "GATE_05_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: gate05-verified-apk
          path: |
            artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
            artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log
            APK_SHA256.txt

  gate-06-package:
    name: "06 - Package and manifest gate"
    needs: gate-05-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate05-verified-apk
          path: artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-android@v3
      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "build-tools;35.0.0" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee badging.txt
          grep -q "package: name='com.kunal.universalvideo'" badging.txt
          grep -q "launchable-activity: name='com.kunal.universalvideo.MainActivity'" badging.txt
          echo "GATE_06_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: gate06-release-apk
          path: artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk

  gate-07-emulator-boot:
    name: "07 - Emulator boot gate"
    needs: gate-06-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb -s emulator-5554 shell cmd package list packages >/dev/null
            echo "GATE_07_PASS"

  gate-08-install:
    name: "08 - APK install gate"
    needs: gate-07-emulator-boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate06-release-apk
          path: artifact
      - name: Install APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb -s emulator-5554 install -r artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            adb -s emulator-5554 shell cmd package list packages | grep -q '^package:com.kunal.universalvideo$'
            echo "GATE_08_PASS"

  gate-09-launch:
    name: "09 - Cold launch gate"
    needs: gate-08-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate06-release-apk
          path: artifact
      - name: Install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb -s emulator-5554 install -r artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            adb -s emulator-5554 logcat -c
            adb -s emulator-5554 shell am start -W -n com.kunal.universalvideo/.MainActivity
            sleep 5
            pid="$(adb -s emulator-5554 shell pidof com.kunal.universalvideo | tr -d '\r' || true)"
            test -n "$pid"
            adb -s emulator-5554 logcat -d -t 1000 > gate09-logcat.txt
            ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.kunal\.universalvideo.*has died' gate09-logcat.txt
            echo "GATE_09_PASS pid=$pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate09-evidence
          path: gate09-logcat.txt
          if-no-files-found: ignore

  gate-10-restart:
    name: "10 - Restart survival gate"
    needs: gate-09-launch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate06-release-apk
          path: artifact
      - name: Restart app and verify process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb -s emulator-5554 install -r artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            adb -s emulator-5554 shell am start -W -n com.kunal.universalvideo/.MainActivity
            sleep 4
            adb -s emulator-5554 shell am force-stop com.kunal.universalvideo
            sleep 2
            adb -s emulator-5554 logcat -c
            adb -s emulator-5554 shell am start -W -n com.kunal.universalvideo/.MainActivity
            sleep 5
            pid="$(adb -s emulator-5554 shell pidof com.kunal.universalvideo | tr -d '\r' || true)"
            test -n "$pid"
            adb -s emulator-5554 logcat -d -t 1000 > gate10-logcat.txt
            ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.kunal\.universalvideo.*has died' gate10-logcat.txt
            echo "GATE_10_PASS pid=$pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate10-evidence
          path: gate10-logcat.txt
          if-no-files-found: ignore

  gate-11-runtime-scan:
    name: "11 - Runtime crash scan"
    needs: gate-10-restart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate06-release-apk
          path: artifact
      - name: Runtime diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb -s emulator-5554 install -r artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            adb -s emulator-5554 logcat -c
            adb -s emulator-5554 shell am start -W -n com.kunal.universalvideo/.MainActivity
            sleep 8
            adb -s emulator-5554 shell dumpsys package com.kunal.universalvideo > package-dump.txt
            adb -s emulator-5554 logcat -d -t 2000 > gate11-logcat.txt
            ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.kunal\.universalvideo.*has died' gate11-logcat.txt
            grep -q 'com.kunal.universalvideo' package-dump.txt
            echo "GATE_11_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate11-evidence
          path: |
            gate11-logcat.txt
            package-dump.txt
          if-no-files-found: ignore

  gate-12-evidence:
    name: "12 - Evidence and checksum gate"
    needs: gate-11-runtime-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate06-release-apk
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: gate09-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: gate10-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: gate11-evidence
          path: evidence
      - name: Create final evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee FINAL_APK_SHA256.txt
          test -s evidence/gate11-logcat.txt
          ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.kunal\.universalvideo.*has died' evidence/gate11-logcat.txt
          printf '%s\n' 'GATE_01_PASS' 'GATE_02_PASS' 'GATE_03_PASS' 'GATE_04_PASS' 'GATE_05_PASS' 'GATE_06_PASS' 'GATE_07_PASS' 'GATE_08_PASS' 'GATE_09_PASS' 'GATE_10_PASS' 'GATE_11_PASS' 'GATE_12_PASS' > GATE_STATUS.txt
          echo "GATE_12_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-13-Gate-Evidence
          path: |
            artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            FINAL_APK_SHA256.txt
            GATE_STATUS.txt
            evidence/

  gate-13-final:
    name: "13 - FINAL VERIFIED PASS"
    needs: gate-12-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KUNAL-Universal-Video-13-Gate-Evidence
          path: final
      - name: Final locked verification
        shell: bash
        run: |
          set -euo pipefail
          test -s final/artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s final/FINAL_APK_SHA256.txt
          test -s final/GATE_STATUS.txt
          test "$(grep -c '^GATE_[0-9][0-9]_PASS$' final/GATE_STATUS.txt)" -eq 12
          sha256sum -c final/FINAL_APK_SHA256.txt
          echo "GATE_13_PASS"
          echo "KUNAL UNIVERSAL VIDEO: 13/13 VERIFIED"
      - uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-FINAL-VERIFIED
          path: final/artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
