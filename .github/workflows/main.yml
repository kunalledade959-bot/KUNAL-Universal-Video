name: Build KUNAL Universal Video APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - ".github/workflows/main.yml"
      - "ci-repair/UniversalAccessibilityService.kt"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact ChromaToon package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
          test -f "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PASS: original package extracted"

      - name: Apply canonical verified AccessibilityService source
        shell: bash
        run: |
          set -euo pipefail
          REPAIR_SOURCE="ci-repair/UniversalAccessibilityService.kt"
          TARGET="$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          test -s "$REPAIR_SOURCE"
          test -f "$TARGET"
          cp "$REPAIR_SOURCE" "$TARGET"
          cmp -s "$REPAIR_SOURCE" "$TARGET"
          echo "PASS: canonical verified AccessibilityService source installed"

      - name: Apply permanent AppCompat startup contract
        shell: bash
        run: |
          set -euo pipefail
          export APP_ROOT="$PROJECT_DIR/app"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app = Path(os.environ["APP_ROOT"])
          manifest = app / "src/main/AndroidManifest.xml"
          build = app / "build.gradle.kts"
          main = app / "src/main/java/com/kunal/universalvideo/MainActivity.kt"
          values = app / "src/main/res/values"
          theme = "@style/KunalRuntimeTheme"

          for p in (manifest, build, main):
              if not p.is_file():
                  raise SystemExit(f"required startup file missing: {p}")

          s = main.read_text(encoding="utf-8")
          if not re.search(r"\bimport\s+androidx\.appcompat\.app\.AppCompatActivity\b", s):
              s = re.sub(
                  r"(?m)^package\s+[^\n]+\n",
                  lambda m: m.group(0) + "\nimport androidx.appcompat.app.AppCompatActivity\n",
                  s,
                  count=1,
              )
          s = re.sub(
              r"\bclass\s+MainActivity\s*:\s*(?:android\.app\.)?Activity\s*\(",
              "class MainActivity : AppCompatActivity(",
              s,
              count=1,
          )
          s = re.sub(
              r"\bclass\s+MainActivity\s*:\s*ComponentActivity\s*\(",
              "class MainActivity : AppCompatActivity(",
              s,
              count=1,
          )
          if not re.search(r"class\s+MainActivity[^\n]*:\s*AppCompatActivity\s*\(", s):
              raise SystemExit("MainActivity is not AppCompatActivity")

          if "setTheme(R.style.KunalRuntimeTheme)" not in s:
              m = re.search(r"(?m)^(\s*)super\.onCreate\s*\(", s)
              if not m:
                  raise SystemExit("MainActivity super.onCreate() not found")
              s = s[:m.start()] + m.group(1) + "setTheme(R.style.KunalRuntimeTheme)\n" + s[m.start():]
          if s.index("setTheme(R.style.KunalRuntimeTheme)") > s.index("super.onCreate"):
              raise SystemExit("runtime theme guard is after super.onCreate")
          main.write_text(s, encoding="utf-8")

          g = build.read_text(encoding="utf-8")
          if "androidx.appcompat:appcompat" not in g:
              m = re.search(r"(?m)^\s*dependencies\s*\{", g)
              if not m:
                  raise SystemExit("dependencies block not found")
              p = g.find("\n", m.start()) + 1
              g = g[:p] + '    implementation("androidx.appcompat:appcompat:1.7.0")\n' + g[p:]
              build.write_text(g, encoding="utf-8")

          values.mkdir(parents=True, exist_ok=True)
          (values / "kunal_runtime_theme.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n''',
              encoding="utf-8",
          )

          x = manifest.read_text(encoding="utf-8")
          def force_theme(m):
              tag = m.group(0)
              if re.search(r'android:theme\s*=\s*"[^"]*"', tag):
                  return re.sub(r'android:theme\s*=\s*"[^"]*"', f'android:theme="{theme}"', tag, count=1)
              return tag[:-1] + f' android:theme="{theme}">'

          x = re.sub(r"<application\b[^>]*>", force_theme, x, count=1, flags=re.S)
          activity = r'<activity\b(?=[^>]*android:name\s*=\s*"[^"]*MainActivity")[^>]*>'
          if not re.search(activity, x, re.S):
              raise SystemExit("MainActivity manifest entry not found")
          x = re.sub(activity, force_theme, x, count=1, flags=re.S)
          manifest.write_text(x, encoding="utf-8")

          final_main = main.read_text(encoding="utf-8")
          final_build = build.read_text(encoding="utf-8")
          final_manifest = manifest.read_text(encoding="utf-8")
          assert re.search(r"class\s+MainActivity[^\n]*:\s*AppCompatActivity\s*\(", final_main)
          assert final_main.index("setTheme(R.style.KunalRuntimeTheme)") < final_main.index("super.onCreate")
          assert "androidx.appcompat:appcompat" in final_build
          assert final_manifest.count(theme) >= 2
          print("PASS: permanent AppCompat startup contract installed")
          PY

      - name: Layer 1-4 source and static audit
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/ScreenCaptureService.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/GalleryExporter.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST"
          grep -q "FOREGROUND_SERVICE" "$MANIFEST"
          grep -q "UniversalAccessibilityService" "$MANIFEST"
          grep -q "ScreenCaptureService" "$MANIFEST"
          grep -q "MediaProjectionManager" "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/ScreenCaptureService.kt"
          grep -q "MediaStore" "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/GalleryExporter.kt"
          grep -q "KunalRuntimeTheme" "$MANIFEST"
          grep -q "setTheme(R.style.KunalRuntimeTheme)" "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          echo "PASS: L1-L4 source/static audit"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          rm -f ./gradlew ./gradlew.bat
          gradle :wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee "$GITHUB_WORKSPACE/gradle-wrapper.log"
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Layer 5 APK artifact verification
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "PASS: L5 APK exists and ZIP integrity is valid"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Publish APK release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_FILE" \
            --title "KUNAL Universal Video APK #${GITHUB_RUN_NUMBER}" \
            --notes "Original ChromaToon package with permanent AppCompat startup contract and canonical verified AccessibilityService source. Runtime emulator verification is separate."
          echo "PASS: APK published as GitHub Release asset $TAG"

      - name: Generate automatic failure diagnosis
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-results"
          STATUS="${{ job.status }}"
          LOG="$GITHUB_WORKSPACE/gradle-build.log"
          {
            echo "# KUNAL Universal Video automatic build diagnosis"
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Job status: $STATUS"
            echo
            echo "## Detected Gradle error signals"
            if [ -f "$LOG" ]; then
              grep -E -i "(FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|Unresolved reference|e: |error:|Caused by:|Exception|Unsupported class file|requires|manifest merger failed)" "$LOG" | tail -n 120 || true
              echo
              echo "## Last 120 log lines"
              tail -n 120 "$LOG" || true
            else
              echo "Gradle build log was not created; failure occurred before Gradle build logging."
            fi
          } > "$GITHUB_WORKSPACE/ci-results/latest-build-diagnosis.md"

      - name: Upload automatic failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-build-diagnostics-${{ github.run_number }}
          path: |
            ci-results/latest-build-diagnosis.md
            gradle-build.log
            gradle-wrapper.log
          if-no-files-found: ignore

      - name: Publish automatic failure diagnosis to repository
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/latest-build-diagnosis.md
          git diff --cached --quiet || git commit -m "ci: publish latest automatic build diagnosis"
          git push
