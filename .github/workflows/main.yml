name: Build KUNAL Universal Video APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "activity_fixed_v2.kt"
      - "target_control_engine.kt"
      - "scene_execution_engine.kt"
      - "chromatoons_adapter.kt"
      - "stage_gate.kt"
      - "pro_repair_v3.py"
      - "post_compile_repair.py"
      - "preflight_patch.py"
      - "CHROMATOONS_OPERATOR_SPEC.md"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"
      - name: Apply deterministic preflight patch
        shell: bash
        run: python3 preflight_patch.py
      - name: Run autonomous repair and build
        shell: bash
        run: |
          set +e
          python3 pro_repair_v3.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "V3 canonical build blocked. Running deterministic post-compile repair..."
            python3 post_compile_repair.py
            rc=$?
          fi
          exit "$rc"
      - name: Publish build diagnostics on failure
        if: always()
        shell: bash
        run: |
          echo "===== KUNAL UNIVERSAL VIDEO BUILD DIAGNOSTICS ====="
          if [ -f KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log ]; then cat KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log; else echo "BUILD_LOG_MISSING"; fi
          echo "===== REPORT ====="
          if [ -f KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json ]; then cat KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json; else echo "REPORT_MISSING"; fi
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-build-diagnostics
          path: |
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          if-no-files-found: warn
      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          sha256sum KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee APK_SHA256.txt
      - name: Upload APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: |
            KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log
            APK_SHA256.txt
          if-no-files-found: error

  emulator-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: artifact
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            adb wait-for-device
            echo "Waiting for Android framework/package service..."
            ready=0
            for i in $(seq 1 90); do
              if adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$' && adb shell cmd package list packages >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 3
            done
            test "$ready" -eq 1
            echo "Android package service is ready."
            adb install -r artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            adb shell am force-stop com.kunal.universalvideo
            adb shell am start -W -n com.kunal.universalvideo/.MainActivity
            sleep 5
            adb shell dumpsys package com.kunal.universalvideo | grep -q 'com.kunal.universalvideo'
            adb shell pidof com.kunal.universalvideo
            adb logcat -d -t 500 > emulator-logcat.txt
            ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\\.kunal\\.universalvideo.*has died'
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-emulator-evidence
          path: emulator-logcat.txt
          if-no-files-found: ignore
