name: Build KUNAL Universal Video APK

# Final integrated APK verification trigger. Production source remains unchanged.

on:
  workflow_dispatch:
    inputs:
      release_after_real_device:
        description: "Release only after real-device evidence has been committed"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "stage_gate.kt"
      - "production_truth_contract.json"
      - ".github/scripts/production_truth_*.py"
      - ".github/scripts/production_truth_pipeline.sh"
      - ".github/scripts/production_truth_audit.py"
      - "pro_repair_v3.py"
      - "mobile_connection_real_fix.py"
      - "progressive_stage_ui_patch.py"
      - "preflight_patch.py"
      - ".github/scripts/emulator-smoke.sh"
      - ".github/scripts/github_update_patch.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"
      - name: Apply deterministic preflight patch
        shell: bash
        run: python3 preflight_patch.py
      - name: Apply GitHub verified update channel
        shell: bash
        run: python3 .github/scripts/github_update_patch.py
      - name: Apply proven real mobile connection patch
        shell: bash
        run: |
          set -euo pipefail
          python3 mobile_connection_real_fix.py
          python3 -m py_compile pro_repair_v3.py
      - name: Apply progressive single-stage UI
        shell: bash
        run: |
          set -euo pipefail
          python3 progressive_stage_ui_patch.py
      - name: Run Production Truth Engine full-log cells
        shell: bash
        run: bash .github/scripts/production_truth_pipeline.sh
      - name: Upload Production Truth full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-production-truth-logs
          path: production-truth-logs
          if-no-files-found: error
      - name: Verify progressive UI source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Only the current stage is available' activity_fixed.kt
          grep -q 'stageButtons' activity_fixed.kt
          grep -q 'targetSpinner.visibility=if(id==3)' activity_fixed.kt
          grep -q 'story.visibility=if(id==5)' activity_fixed.kt
      - name: Run autonomous repair and build
        shell: bash
        run: python3 pro_repair_v3.py
      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          sha256sum KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee APK_SHA256.txt
      - name: Upload APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: |
            KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log
            APK_SHA256.txt
            production-truth-audit.json
          if-no-files-found: error

  emulator-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install emulator test components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64"
          echo "no" | avdmanager create avd --force -n kunal-smoke --package "system-images;android-35;default;x86_64" --device "pixel_2"
          AVD_BASE="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          AVD_DIR=""
          if [[ -f "$AVD_BASE/kunal-smoke.avd/config.ini" ]]; then
            AVD_DIR="$AVD_BASE/kunal-smoke.avd"
          else
            AVD_DIR="$(avdmanager list avd | awk -v name="kunal-smoke" '
              $0 ~ "Name: " name {found=1; next}
              found && /Path: / {sub(/^.*Path: /, ""); print; exit}
            ')"
          fi
          if [[ -z "$AVD_DIR" || ! -f "$AVD_DIR/config.ini" ]]; then
            echo "ERROR: Could not resolve created AVD directory"
            echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-<unset>}"
            echo "AVD_BASE=$AVD_BASE"
            avdmanager list avd || true
            find "$HOME" -maxdepth 5 -type f -name config.ini -path '*kunal-smoke.avd/*' -print || true
            exit 1
          fi
          echo "Using AVD_DIR=$AVD_DIR"
          printf 'hw.cpu.ncore=4\nhw.ramSize=3072\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\n' >> "$AVD_DIR/config.ini"
          echo "AVD_CONFIG=$AVD_DIR/config.ini" >> "$GITHUB_ENV"
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: artifact
      - name: Run deterministic emulator smoke test
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ env.ANDROID_AVD_HOME }}
        run: bash .github/scripts/emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-emulator-evidence
          path: |
            emulator.log
            emulator-logcat.txt
            emulator-restart-logcat.txt
            adb-devices.txt
          if-no-files-found: ignore

  release-gate:
    needs: emulator-smoke-test
    if: needs.emulator-smoke-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
      - name: Validate real-device release evidence
        shell: bash
        env:
          RELEASE_APPROVAL: ${{ inputs.release_after_real_device || 'false' }}
        run: |
          set -uo pipefail
          rc=0
          echo "RELEASE_APPROVAL=$RELEASE_APPROVAL"
          if [[ "$RELEASE_APPROVAL" != "true" ]]; then
            echo "REAL_DEVICE_RELEASE_GATE=NOT_APPROVED"
            echo "Reason: build/emulator evidence cannot substitute for physical-device evidence."
            exit 0
          fi
          if [[ ! -s real_device_release_evidence.json ]]; then
            echo "ERROR: real_device_release_evidence.json is missing"
            rc=1
          else
            python3 - <<'PY' || rc=1
import json
from pathlib import Path
o=json.loads(Path("real_device_release_evidence.json").read_text(encoding="utf-8"))
assert o.get("schema") == 1
assert o.get("verified") is True
assert o.get("stage_count") == 13
assert o.get("real_device") is True
assert o.get("evidence_complete") is True
assert o.get("commit_sha") == "${{ github.sha }}"
print("REAL_DEVICE_EVIDENCE=VALID")
PY
          fi
          exit "$rc"
      - name: Release only with real-device evidence
        if: inputs.release_after_real_device == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="verified-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk \
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json \
            APK_SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Verified APK ${GITHUB_RUN_NUMBER}" \
            --notes "Release allowed only after build, emulator, 13-stage independent verification, and real-device evidence. Commit: ${GITHUB_SHA}."
