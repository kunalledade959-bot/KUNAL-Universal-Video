name: Build KUNAL Universal Video APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - ".github/workflows/main.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact ChromaToon verification package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
          test -f "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run 7-layer source/static verification
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_FILE="$(find verification-package -type f -name verify_7_layers.py -print -quit)"
          test -n "$VERIFY_FILE"
          python "$VERIFY_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print
          test "$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | wc -l)" -gt 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
