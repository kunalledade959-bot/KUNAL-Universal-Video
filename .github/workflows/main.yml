name: Build KUNAL Universal Video APK

# Final integrated APK verification trigger. Production source remains unchanged.

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "pro_repair_v3.py"
      - "mobile_connection_real_fix.py"
      - "preflight_patch.py"
      - ".github/scripts/emulator-smoke.sh"
      - ".github/scripts/github_update_patch.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"
      - name: Apply deterministic preflight patch
        shell: bash
        run: python3 preflight_patch.py
      - name: Apply GitHub verified update channel
        shell: bash
        run: python3 .github/scripts/github_update_patch.py
      - name: Apply proven real mobile connection patch
        shell: bash
        run: |
          set -euo pipefail
          python3 mobile_connection_real_fix.py
          python3 -m py_compile pro_repair_v3.py
      - name: Run autonomous repair and build
        shell: bash
        run: python3 pro_repair_v3.py
      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          sha256sum KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk | tee APK_SHA256.txt
      - name: Upload APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: |
            KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_BUILD.log
            APK_SHA256.txt
          if-no-files-found: error

  emulator-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: artifact
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: false
          script: bash .github/scripts/emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-emulator-evidence
          path: |
            emulator-logcat.txt
            emulator-restart-logcat.txt
          if-no-files-found: ignore

  publish-verified-release:
    needs: emulator-smoke-test
    if: needs.emulator-smoke-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: release
      - name: Publish immutable verified APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="verified-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release/KUNAL-Universal-Video_PRO_V3.apk \
            release/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk \
            release/KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json \
            release/APK_SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Verified APK ${GITHUB_RUN_NUMBER}" \
            --notes "Production APK verified by build + Android emulator smoke test. Commit: ${GITHUB_SHA}. The APK SHA-256 is stored in APK_SHA256.txt."
