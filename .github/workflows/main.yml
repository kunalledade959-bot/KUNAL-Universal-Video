name: Build KUNAL Universal Video APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
      - ".github/workflows/main.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract verified Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
          test -f "$ZIP_FILE"
          rm -rf android-project
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project
          PROJECT_DIR="$(find android-project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print
          test "$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | wc -l)" -gt 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
