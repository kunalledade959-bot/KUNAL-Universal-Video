name: Exhaustive 13-Stage Problem Discovery

# Manual-only: problem discovery runs only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run exhaustive problem discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/exhaustive_sequence_problem_discovery.py

      - name: Upload complete problem report
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-13-stage-problem-report
          path: exhaustive-sequence-problem-report.md
          if-no-files-found: error
