name: Runtime Crash Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
      - ".github/workflows/runtime-diagnostic.yml"
      - ".github/workflows/runtime-watchdog.yml"
      - ".github/scripts/runtime-diagnostic.sh"

concurrency:
  group: kunal-universal-video-runtime-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate authoritative Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
          test -s "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "AUTHORITATIVE_PROJECT=$ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Production integrity gate
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find "$PROJECT_DIR" -type f -name 'activity_fixed.kt' -print -quit)"
          test -s "$SRC"
          BUTTON_COUNT="$(grep -Ec 'button\("[0-9]+ •' "$SRC" || true)"
          test "$BUTTON_COUNT" -eq 13
          for n in $(seq 1 13); do
            grep -Eq "if\(!begin\($n\)\)return" "$SRC"
          done
          grep -Fq 'UniversalAccessibilityService.instance!=null' "$SRC"
          grep -Fq 'Selected target disappeared from installed-app list' "$SRC"
          grep -Fq 'Selected target has no launchable activity' "$SRC"
          grep -Fq 'Target selected but AccessibilityService is not currently bound' "$SRC"
          grep -Fq 'Target selected but real controller target handshake failed' "$SRC"
          if grep -Fq 'Thread.sleep' "$SRC"; then
            echo 'INTEGRITY_FAIL: UI-blocking Thread.sleep remains in authoritative activity'
            exit 1
          fi
          grep -Fq 'postDelayed({waitForTargetForeground' "$SRC"
          grep -Fq 'TTS synthesis did not produce usable audio' "$SRC"
          grep -Fq 'Recording stopped but no real MediaStore video was produced' "$SRC"
          grep -Fq 'required media track missing' "$SRC"
          grep -Fq 'MP4 has no readable tracks' "$SRC"
          grep -Fq 'Gallery insert failed' "$SRC"
          echo 'INTEGRITY_PASS: 13-stage gate structure, real target verification, non-blocking stage 6, media evidence and export failure paths verified'

      - name: Build APK before emulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          "$GRADLE_CMD" :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          mkdir -p "$GITHUB_WORKSPACE/built-apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/built-apk/KUNAL-Universal-Video-debug.apk"
          echo "APK=$APK_FILE"
          ls -lh "$GITHUB_WORKSPACE/built-apk/KUNAL-Universal-Video-debug.apk"

      - name: Upload built APK
        uses: actions/upload-artifact@v7
        with:
          name: KUNAL-Universal-Video-BUILT-APK
          path: built-apk/KUNAL-Universal-Video-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KUNAL-Universal-Video-build-log
          path: build.log
          if-no-files-found: ignore

  runtime-diagnostic:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified build output
        uses: actions/download-artifact@v7
        with:
          name: KUNAL-Universal-Video-BUILT-APK
          path: built-apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Android runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash "$GITHUB_WORKSPACE/.github/scripts/runtime-diagnostic.sh"

      - name: Upload verified startup APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: KUNAL-Universal-Video-VERIFIED-APK
          path: final-apk/KUNAL-Universal-Video-debug.apk
          if-no-files-found: error

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KUNAL-Universal-Video-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: ignore
