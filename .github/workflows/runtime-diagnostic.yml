name: Runtime Crash Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
      - ".github/workflows/runtime-diagnostic.yml"
      - ".github/workflows/runtime-watchdog.yml"

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          for candidate in KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT.zip; do
            if [ -f "$candidate" ]; then ZIP_FILE="$candidate"; break; fi
          done
          test -n "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Autonomous build and Android runtime repair loop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set +e
            cd "$PROJECT_DIR"
            gradle :wrapper --gradle-version 8.9 --distribution-type bin
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            mkdir -p "$GITHUB_WORKSPACE/runtime-evidence" "$GITHUB_WORKSPACE/final-apk"

            PACKAGE=""
            ACTIVITY=""
            MAX_ATTEMPTS=30

            repair_environment() {
              echo "[REPAIR] applying Android runtime recovery"
              adb shell settings put global verifier_verify_adb_installs 0 2>/dev/null || true
              adb shell settings put global package_verifier_enable 0 2>/dev/null || true
              if [ -n "$PACKAGE" ]; then
                adb shell am force-stop "$PACKAGE" 2>/dev/null || true
                adb shell pm clear "$PACKAGE" 2>/dev/null || true
                adb uninstall "$PACKAGE" 2>/dev/null || true
              fi
              adb kill-server 2>/dev/null || true
              sleep 2
              adb start-server 2>/dev/null || true
              adb wait-for-device
            }

            for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
              echo "=================================================="
              echo "AUTONOMOUS ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
              echo "=================================================="

              rm -rf app/build
              ./gradlew :app:assembleDebug --no-daemon --stacktrace > "$GITHUB_WORKSPACE/runtime-evidence/build-$ATTEMPT.log" 2>&1
              BUILD_RC=$?
              if [ "$BUILD_RC" -ne 0 ]; then
                echo "BUILD_FAIL attempt=$ATTEMPT"
                tail -n 120 "$GITHUB_WORKSPACE/runtime-evidence/build-$ATTEMPT.log" || true
                repair_environment
                continue
              fi

              APK_FILE="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
              if [ ! -s "$APK_FILE" ]; then
                echo "APK_BUILD_OUTPUT_MISSING"
                repair_environment
                continue
              fi

              PACKAGE="$(aapt dump badging "$APK_FILE" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
              ACTIVITY="$(aapt dump badging "$APK_FILE" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p")"
              echo "PACKAGE=$PACKAGE"
              echo "ACTIVITY=$ACTIVITY"
              if [ -z "$PACKAGE" ] || [ -z "$ACTIVITY" ]; then
                echo "APK_METADATA_INVALID"
                repair_environment
                continue
              fi

              adb wait-for-device
              adb logcat -c
              adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
              adb install "$APK_FILE" > "$GITHUB_WORKSPACE/runtime-evidence/install-$ATTEMPT.log" 2>&1
              INSTALL_RC=$?
              if [ "$INSTALL_RC" -ne 0 ]; then
                echo "INSTALL_FAIL attempt=$ATTEMPT"
                cat "$GITHUB_WORKSPACE/runtime-evidence/install-$ATTEMPT.log" || true
                repair_environment
                continue
              fi

              adb shell am force-stop "$PACKAGE" || true
              adb shell am start -n "$PACKAGE/$ACTIVITY" > "$GITHUB_WORKSPACE/runtime-evidence/start-$ATTEMPT.log" 2>&1
              sleep 12
              adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/runtime-evidence/logcat-$ATTEMPT.log"
              PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
              echo "PID=$PID"

              if [ -z "$PID" ]; then
                echo "RUNTIME_CRASH_CONFIRMED attempt=$ATTEMPT"
                tail -n 250 "$GITHUB_WORKSPACE/runtime-evidence/logcat-$ATTEMPT.log" || true
                repair_environment
                continue
              fi

              adb shell am force-stop "$PACKAGE"
              adb shell am start -n "$PACKAGE/$ACTIVITY" >/dev/null 2>&1 || true
              sleep 8
              PID2="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
              if [ -z "$PID2" ]; then
                echo "RESTART_CRASH_CONFIRMED attempt=$ATTEMPT"
                repair_environment
                continue
              fi

              echo "RUNTIME_STARTUP_SURVIVED"
              cp "$APK_FILE" "$GITHUB_WORKSPACE/final-apk/KUNAL-Universal-Video-debug.apk"
              echo "VERIFIED_APK_READY"
              exit 0
            done

            echo "ALL_AUTONOMOUS_ATTEMPTS_EXHAUSTED"
            exit 1

      - name: Upload final APK and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-VERIFIED-APK
          path: final-apk/KUNAL-Universal-Video-debug.apk
          if-no-files-found: error

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
