name: Runtime Crash Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
      - ".github/workflows/runtime-diagnostic.yml"

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          for candidate in KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT.zip; do
            if [ -f "$candidate" ]; then ZIP_FILE="$candidate"; break; fi
          done
          test -n "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Autonomous build and Android runtime repair loop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set +e
            cd "$PROJECT_DIR"
            gradle :wrapper --gradle-version 8.9 --distribution-type bin
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            mkdir -p "$GITHUB_WORKSPACE/runtime-evidence" "$GITHUB_WORKSPACE/final-apk"

            PACKAGE=""
            ACTIVITY=""
            MAX_ATTEMPTS=30

            repair_environment() {
              echo "[REPAIR] applying Android runtime recovery"
              adb shell settings put global verifier_verify_adb_installs 0 2>/dev/null || true
              adb shell settings put global package_verifier_enable 0 2>/dev/null || true
              adb shell settings put global verifier_verify_adb_installs 0 2>/dev/null || true
              if [ -n "$PACKAGE" ]; then
                adb shell am force-stop "$PACKAGE" 2>/dev/null || true
                adb shell pm clear "$PACKAGE" 2>/dev/null || true
                adb uninstall "$PACKAGE" 2>/dev/null || true
              fi
              adb kill-server 2>/dev/null || true
              sleep 2
              adb start-server 2>/dev/null || true
              adb wait-for-device
              adb shell settings put global verifier_verify_adb_installs 0 2>/dev/null || true
              adb shell settings put global package_verifier_enable 0 2>/dev/null || true
            }

            for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
              echo "=================================================="
              echo "AUTONOMOUS ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
              echo "=================================================="

              rm -rf app/build
              ./gradlew :app:assembleDebug --no-daemon --stacktrace > "$GITHUB_WORKSPACE/runtime-evidence/build-$ATTEMPT.log" 2>&1
              BUILD_RC=$?
              if [ "$BUILD_RC" -ne 0 ]; then
                echo "BUILD_FAIL attempt=$ATTEMPT"
                tail -n 120 "$GITHUB_WORKSPACE/runtime-evidence/build-$ATTEMPT.log" || true
                echo "[REPAIR] Gradle recovery"
                rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle 2>/dev/null || true
                sleep 5
                continue
              fi

              APK_FILE="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
              if [ ! -s "$APK_FILE" ]; then
                echo "APK_BUILD_OUTPUT_MISSING"
                continue
              fi

              PACKAGE="$(aapt dump badging "$APK_FILE" | sed -n "s/package: name='\\([^']*\\)'.*/\\1/p")"
              ACTIVITY="$(aapt dump badging "$APK_FILE" | sed -n "s/launchable-activity: name='\\([^']*\\)'.*/\\1/p")"
              echo "PACKAGE=$PACKAGE"
              echo "ACTIVITY=$ACTIVITY"
              if [ -z "$PACKAGE" ]; then
                echo "PACKAGE_PARSE_FAIL"
                continue
              fi

              adb wait-for-device
              adb shell settings put global verifier_verify_adb_installs 0 2>/dev/null || true
              adb shell settings put global package_verifier_enable 0 2>/dev/null || true
              adb logcat -c

              adb install --no-streaming "$APK_FILE" > "$GITHUB_WORKSPACE/runtime-evidence/install-$ATTEMPT.log" 2>&1
              INSTALL_RC=$?
              if [ "$INSTALL_RC" -ne 0 ]; then
                echo "INSTALL_FAIL attempt=$ATTEMPT"
                cat "$GITHUB_WORKSPACE/runtime-evidence/install-$ATTEMPT.log" || true
                repair_environment
                continue
              fi

              LAUNCH_RC=1
              if [ -n "$ACTIVITY" ]; then
                adb shell am force-stop "$PACKAGE" || true
                adb shell am start -W -n "$PACKAGE/$ACTIVITY" > "$GITHUB_WORKSPACE/runtime-evidence/launch-$ATTEMPT.log" 2>&1
                LAUNCH_RC=$?
              fi
              if [ "$LAUNCH_RC" -ne 0 ]; then
                adb shell monkey -p "$PACKAGE" 1 > "$GITHUB_WORKSPACE/runtime-evidence/monkey-$ATTEMPT.log" 2>&1
                LAUNCH_RC=$?
              fi

              sleep 15
              adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/runtime-evidence/logcat-$ATTEMPT.log" 2>&1 || true
              PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
              CRASH="$(grep -E "FATAL EXCEPTION|AndroidRuntime: FATAL|Process: $PACKAGE" "$GITHUB_WORKSPACE/runtime-evidence/logcat-$ATTEMPT.log" | tail -n 20 || true)"

              echo "LAUNCH_RC=$LAUNCH_RC PID=$PID"
              if [ -n "$PID" ] && [ -z "$CRASH" ]; then
                echo "[PASS] install + launch + 15s survival"

                adb shell am force-stop "$PACKAGE" || true
                if [ -n "$ACTIVITY" ]; then adb shell am start -W -n "$PACKAGE/$ACTIVITY" >/dev/null 2>&1 || adb shell monkey -p "$PACKAGE" 1 >/dev/null 2>&1; else adb shell monkey -p "$PACKAGE" 1 >/dev/null 2>&1; fi
                sleep 10
                PID2="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
                if [ -n "$PID2" ]; then
                  adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                  adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/runtime-evidence/ui.xml" >/dev/null 2>&1 || true
                  cp "$APK_FILE" "$GITHUB_WORKSPACE/final-apk/KUNAL-Universal-Video-verified.apk"
                  echo "FULL_RUNTIME_GATE_PASS"
                  exit 0
                fi
              fi

              echo "[FAIL] runtime launch/crash"
              echo "===== LOG TAIL ====="
              tail -n 250 "$GITHUB_WORKSPACE/runtime-evidence/logcat-$ATTEMPT.log" || true
              repair_environment
            done

            echo "AUTONOMOUS_RUNTIME_EXHAUSTED_WITHOUT_VERIFIED_PASS"
            exit 1

      - name: Upload final verified APK and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-overnight-runtime
          path: |
            final-apk/
            runtime-evidence/
          if-no-files-found: warn
