name: Runtime Crash Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip"
      - ".github/workflows/runtime-diagnostic.yml"
      - ".github/workflows/runtime-watchdog.yml"
      - ".github/scripts/runtime-diagnostic.sh"

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate Android project package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          for candidate in KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT.zip; do
            if [ -f "$candidate" ]; then ZIP_FILE="$candidate"; break; fi
          done
          test -n "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Autonomous build and Android runtime repair loop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash "$GITHUB_WORKSPACE/.github/scripts/runtime-diagnostic.sh"

      - name: Upload final APK and evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: KUNAL-Universal-Video-VERIFIED-APK
          path: final-apk/KUNAL-Universal-Video-debug.apk
          if-no-files-found: error

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KUNAL-Universal-Video-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: ignore
