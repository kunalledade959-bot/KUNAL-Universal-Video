name: Ultra Pro Coding Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kunal-ultra-pro-coding-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ultra-pro-coding-lock:
    name: Ultra Pro Coding Lock
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      KUNAL_KEEP_EMULATOR_AFTER_GATE: '1'
    steps:
      - name: Checkout exact change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install exact Android components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          set +e
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1
          PS=(${PIPESTATUS[@]})
          set -e
          cat /tmp/sdk-licenses.log
          echo "LICENSE_YES_EXIT=${PS[0]}"
          echo "LICENSE_SDKMANAGER_EXIT=${PS[1]}"
          (( PS[1] == 0 ))
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;default;x86_64'

      - name: Deterministic production quality firewall
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/production-quality-audit.sh
          bash -n .github/scripts/*.sh
          python3 -m py_compile *.py

      - name: Static zero-bypass gate
        shell: bash
        run: |
          set -euo pipefail
          test -x .github/scripts/self-healing-gate.sh
          test -x .github/scripts/final-production-user-flow.sh
          # production-quality-audit.sh owns the complete bypass-token scan and
          # deliberately excludes its own scanner vocabulary to avoid self-matches.
          for f in .github/scripts/*.sh; do
            case "$f" in
              .github/scripts/production-quality-audit.sh|.github/scripts/failure-intelligence-test.sh) continue ;;
            esac
            if grep -InE '(continue-on-error:[[:space:]]*true|ALLOW[[:space:]]+FAIL|DISABLE[[:space:]]+CHECK|SKIP[[:space:]]+CHECK|TEMP_FIX)' "$f"; then
              echo "ZERO_BYPASS_TOKEN_FOUND_IN=$f"
              exit 1
            fi
          done
          for n in $(seq 1 13); do
            echo "STATIC_STAGE_CONTRACT_CHECK_START=$n"
            if ! bash .github/scripts/sequence-stage-check.sh "$n"; then
              rc=$?
              echo "STATIC_STAGE_CONTRACT_CHECK_FAIL=$n"
              echo "STATIC_STAGE_CONTRACT_CHECK_EXIT=$rc"
              exit "$rc"
            fi
            echo "STATIC_STAGE_CONTRACT_CHECK_PASS=$n"
          done
          require_repo_token() {
            local token="$1"
            if ! grep -RIn "$token" . --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle >/dev/null; then
              echo "STATIC_REQUIRED_TOKEN_MISSING=$token"
              exit 1
            fi
            echo "STATIC_REQUIRED_TOKEN_PRESENT=$token"
          }
          require_repo_token 'UniversalAccessibilityService'
          require_repo_token 'StageGate'
          require_repo_token 'MediaProjection'
          require_repo_token 'TextToSpeech'

      - name: Authoritative production build + full emulator E2E
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/self-healing-gate.sh
          test -s artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s e2e-PASS.txt

      - name: Production Stage 2 → Stage 3 → target handoff flow
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/final-production-user-flow.sh
          test -s final-user-flow-evidence/PASS.txt
          grep -Fq 'FINAL_PRODUCTION_USER_FLOW_PASS' final-user-flow-evidence/PASS.txt
          grep -Fq 'TARGET_PERSISTENCE=PASS' final-user-flow-evidence/PASS.txt
          grep -Fq 'TARGET_FOREGROUND=PASS' final-user-flow-evidence/PASS.txt

      - name: Dispose chained production emulator
        if: always()
        shell: bash
        run: |
          set +e
          adb -s emulator-5554 emu kill >/dev/null 2>&1
          exit 0

      - name: Final evidence integrity gate
        shell: bash
        run: |
          set -euo pipefail
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -Fq '\"status\": \"STATIC_AND_BUILD_VERIFIED\"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          test -s final-user-flow-evidence/final-user-flow.log
          test -s final-user-flow-evidence/ui-after-stage2.xml
          test -s final-user-flow-evidence/ui-after-save.xml
          test -s final-user-flow-evidence/prefs.txt
          test -s final-user-flow-evidence/accessibility-post-stage2-dumpsys.txt
          if grep -Eiq 'FATAL EXCEPTION|ANR in|Application Not Responding|DeadSystemException|Fatal signal' final-user-flow-evidence/final-user-flow.log final-user-flow-evidence/crash-logcat.txt; then
            echo 'CRASH_OR_ANR_FOUND_IN_REQUIRED_FLOW'
            exit 1
          fi
          echo 'ULTRA_PRO_CODING_LOCK_PASS'
