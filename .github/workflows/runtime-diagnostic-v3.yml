name: Runtime Crash Diagnostic V3

on:
  workflow_dispatch:
  push:
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "ci-repair/UniversalAccessibilityService.kt"
      - ".github/workflows/runtime-diagnostic-v3.yml"

permissions:
  contents: write

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize self-report
        shell: bash
        run: |
          set -u
          mkdir -p ci-results
          printf '# Runtime Verification\nStatus: IN_PROGRESS\n' > ci-results/runtime-v3-latest.md
          echo "EMULATOR_STEP_NOT_STARTED" > runtime-status.txt

      - name: Extract project and apply verified repair
        shell: bash
        run: |
          set -euo pipefail
          unzip -q KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          TARGET="$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          cp ci-repair/UniversalAccessibilityService.kt "$TARGET"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Build diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :wrapper --gradle-version 8.9 --distribution-type bin
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK_FILE="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          echo "APK_FILE=$PWD/$APK_FILE" >> "$GITHUB_ENV"
          echo "BUILD_PASS" > "$GITHUB_WORKSPACE/runtime-status.txt"

      - name: Reclaim runner disk before emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DISK BEFORE CLEANUP ==="
          df -h /
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists" "$HOME/.gradle/daemon" "$HOME/.gradle/native" "$HOME/.gradle/workers" || true
          sudo rm -rf "$ANDROID_HOME/system-images" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" "$ANDROID_HOME/tools" || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          rm -rf "$HOME/.android/avd" || true
          mkdir -p "$HOME/.android/avd"
          echo "=== DISK AFTER CLEANUP ==="
          df -h /
          FREE_MB="$(df -Pm / | awk 'NR==2 {print $4}')"
          echo "FREE_MB=$FREE_MB"
          test "$FREE_MB" -ge 11000

      - name: Enable KVM correctly on Linux runner
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo "=== KVM DEVICE ==="
          ls -l /dev/kvm || true
          echo "=== EMULATOR ACCELERATION CHECK ==="
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>/dev/null || true
          echo "=== CPU ==="
          nproc

      - name: Install and launch APK on hardened emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disk-size: 10G
          avd-name: kunal-runtime-v4-api30
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          disable-linux-hw-accel: auto
          channel: stable
          pre-emulator-launch-script: |
            set -eu
            echo "=== KVM FINAL CHECK ==="
            ls -l /dev/kvm || true
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            echo "=== ADB RESET ==="
            adb kill-server || true
            adb start-server
          script: |
            set -u
            echo "EMULATOR_STEP_STARTED" > "$GITHUB_WORKSPACE/runtime-status.txt"
            APK="$GITHUB_WORKSPACE/${APK_FILE#${GITHUB_WORKSPACE}/}"
            adb start-server
            adb wait-for-device
            for i in $(seq 1 180); do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              DEV="$(adb get-state 2>/dev/null | tr -d '\r' || true)"
              echo "BOOT_CHECK $i/180 state=$DEV boot=$BOOT"
              if [ "$DEV" = "device" ] && [ "$BOOT" = "1" ]; then break; fi
              sleep 5
            done
            DEV="$(adb get-state 2>/dev/null | tr -d '\r' || true)"
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$DEV" != "device" ] || [ "$BOOT" != "1" ]; then
              echo "EMULATOR_BOOT_FAILED" > "$GITHUB_WORKSPACE/runtime-status.txt"
              adb devices -l || true
              exit 1
            fi
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb logcat -c
            adb install -r "$APK"
            PACKAGE="$(aapt dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
            ACTIVITY="$(aapt dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p")"
            echo "PACKAGE=$PACKAGE"
            echo "ACTIVITY=$ACTIVITY"
            test -n "$PACKAGE"
            test -n "$ACTIVITY"
            adb shell am force-stop "$PACKAGE" || true
            adb shell am start -W -n "$PACKAGE/$ACTIVITY" > startup-result.txt 2>&1 || true
            sleep 10
            adb logcat -d -v threadtime > runtime-log.txt
            adb shell dumpsys package "$PACKAGE" > package-dump.txt 2>&1 || true
            echo "===== STARTUP RESULT ====="
            cat startup-result.txt
            echo "===== CRASH LOG ====="
            grep -E -A12 -B5 "AndroidRuntime|FATAL EXCEPTION|Process:|Caused by:|Fatal signal|SecurityException|Exception" runtime-log.txt | tail -n 400 || true
            echo "===== PROCESS STATE ====="
            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            echo "$PID"
            if [ -z "$PID" ]; then
              echo "RUNTIME_CRASH_CONFIRMED" > "$GITHUB_WORKSPACE/runtime-status.txt"
              exit 1
            fi
            echo "RUNTIME_STARTUP_SURVIVED" > "$GITHUB_WORKSPACE/runtime-status.txt"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostic-v4-logs
          path: |
            startup-result.txt
            runtime-log.txt
            package-dump.txt
            runtime-status.txt
          if-no-files-found: ignore

      - name: Publish self-report
        if: always()
        shell: bash
        run: |
          set -u
          STATUS="$(cat runtime-status.txt 2>/dev/null || echo UNKNOWN)"
          {
            echo "# Runtime Verification V4"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Status: $STATUS"
            echo "Runner: ubuntu-22.04"
            echo "Emulator: API 30 / Pixel 2 / x86_64 / 10G userdata"
            echo
            case "$STATUS" in
              RUNTIME_STARTUP_SURVIVED) echo "PASS: APK installed and launcher process remained alive after startup." ;;
              RUNTIME_CRASH_CONFIRMED) echo "FAIL: APK installed but launcher process was not alive after startup." ;;
              EMULATOR_BOOT_FAILED|EMULATOR_STEP_STARTED) echo "INFRA_FAIL: emulator did not reach a healthy Android boot state." ;;
              BUILD_PASS) echo "INFRA_FAIL: APK built but emulator verification did not complete." ;;
              *) echo "INCONCLUSIVE: inspect workflow diagnostics." ;;
            esac
          } > ci-results/runtime-v3-latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/runtime-v3-latest.md
          git diff --cached --quiet || git commit -m "ci: fix emulator userdata space and shell verification"
          git push
