name: Sequence 01 - Startup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sequence-01.yml'
permissions:
  contents: read
jobs:
  sequence-01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sequence 01
        run: bash .github/scripts/sequence-stage-check.sh 1
