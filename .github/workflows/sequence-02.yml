name: Sequence 02 - Mobile Connection

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "30"
  ANDROID_ADB_SERVER_PORT: "5037"

jobs:
  sequence-02-deep-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Build APK using the existing production build path
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          python3 mobile_connection_real_fix.py
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          mkdir -p artifact
          cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk

      - name: Run exhaustive Sequence 02 diagnostic on fresh emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -no-metrics -camera-back none -memory 3072
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/sequence-02-deep-diagnostic.sh

      - name: Upload Sequence 02 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-02-deep-diagnostic-evidence
          path: |
            sequence-02-*.txt
            sequence-02-*.xml
          if-no-files-found: warn
