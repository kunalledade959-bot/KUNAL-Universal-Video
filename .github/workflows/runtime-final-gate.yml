name: Runtime Final Gate - KUNAL Universal Video

on:
  push:
    branches:
      - chroma-toon-7layer-build
    paths:
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - ".github/workflows/runtime-final-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          APP_DIR="$PROJECT_DIR/app"
          test -f "$APP_DIR/build.gradle.kts"
          test -f "$APP_DIR/src/main/AndroidManifest.xml"
          test -f "$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MANIFEST=$APP_DIR/src/main/AndroidManifest.xml" >> "$GITHUB_ENV"
          echo "MAIN_ACTIVITY=$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_DIR/build.gradle.kts" >> "$GITHUB_ENV"

      - name: Apply absolute AppCompat startup contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          app=Path(os.environ['APP_DIR'])
          manifest=Path(os.environ['MANIFEST'])
          build=Path(os.environ['APP_BUILD'])
          main=Path(os.environ['MAIN_ACTIVITY'])
          theme='@style/KunalRuntimeTheme'

          s=main.read_text(encoding='utf-8')
          if not re.search(r'(?m)^\s*import\s+androidx\.appcompat\.app\.AppCompatActivity\s*$',s):
              m=re.search(r'(?m)^package\s+[^\n]+\n',s)
              if not m: raise SystemExit('MainActivity package declaration missing')
              s=s[:m.end()]+'\nimport androidx.appcompat.app.AppCompatActivity\n'+s[m.end():]
          s=re.sub(r'\bclass\s+MainActivity\s*:\s*(?:android\.app\.)?Activity\s*\(', 'class MainActivity : AppCompatActivity(', s, count=1)
          s=re.sub(r'\bclass\s+MainActivity\s*:\s*ComponentActivity\s*\(', 'class MainActivity : AppCompatActivity(', s, count=1)
          if not re.search(r'\bclass\s+MainActivity\s*:\s*AppCompatActivity\s*\(',s):
              raise SystemExit('ABSOLUTE STARTUP GATE: MainActivity is not AppCompatActivity')
          if 'setTheme(R.style.KunalRuntimeTheme)' not in s:
              m=re.search(r'(?m)^(\s*)override\s+fun\s+onCreate\s*\(',s)
              if not m: raise SystemExit('onCreate not found')
              body_start=s.find('{',m.end())
              if body_start<0: raise SystemExit('onCreate opening brace not found')
              s=s[:body_start+1]+'\n'+m.group(1)+'    setTheme(R.style.KunalRuntimeTheme)'+s[body_start+1:]
          theme_pos=s.find('setTheme(R.style.KunalRuntimeTheme)')
          super_pos=s.find('super.onCreate')
          if theme_pos<0 or super_pos<0 or theme_pos>super_pos:
              raise SystemExit('ABSOLUTE STARTUP GATE: theme must be set before super.onCreate')
          main.write_text(s,encoding='utf-8')

          g=build.read_text(encoding='utf-8')
          if 'androidx.appcompat:appcompat' not in g:
              m=re.search(r'(?m)^\s*dependencies\s*\{',g)
              if not m: raise SystemExit('dependencies block missing')
              p=g.find('\n',m.start())+1
              g=g[:p]+'    implementation("androidx.appcompat:appcompat:1.7.0")\n'+g[p:]
              build.write_text(g,encoding='utf-8')

          values=app/'src/main/res/values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'kunal_runtime_theme.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n''',encoding='utf-8')

          x=manifest.read_text(encoding='utf-8')
          def force_theme(m):
              tag=m.group(0)
              if re.search(r'android:theme\s*=\s*"[^"]*"',tag):
                  return re.sub(r'android:theme\s*=\s*"[^"]*"',f'android:theme="{theme}"',tag,count=1)
              return tag[:-1]+f' android:theme="{theme}">'
          x=re.sub(r'<application\b[^>]*>',force_theme,x,count=1,flags=re.S)
          x=re.sub(r'<activity\b(?=[^>]*android:name\s*=\s*"[^"]*MainActivity")[^>]*>',force_theme,x,count=1,flags=re.S)
          manifest.write_text(x,encoding='utf-8')

          final_main=main.read_text(encoding='utf-8')
          final_manifest=manifest.read_text(encoding='utf-8')
          final_build=build.read_text(encoding='utf-8')
          assert 'AppCompatActivity' in final_main
          assert 'setTheme(R.style.KunalRuntimeTheme)' in final_main
          assert final_main.find('setTheme(R.style.KunalRuntimeTheme)') < final_main.find('super.onCreate')
          assert 'androidx.appcompat:appcompat:1.7.0' in final_build
          assert 'name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar"' in (values/'kunal_runtime_theme.xml').read_text()
          assert 'android:theme="@style/KunalRuntimeTheme"' in final_manifest
          print('ABSOLUTE STARTUP THEME CONTRACT: PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle :wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee "$GITHUB_WORKSPACE/gradle-wrapper.log"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify APK artifact and launcher identity
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$APP_DIR/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "APK SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK_FILE" | tee "$GITHUB_WORKSPACE/aapt-badging.txt"
          grep -q "package: name='com.kunal.universalvideo'" "$GITHUB_WORKSPACE/aapt-badging.txt"
          grep -q "launchable-activity: name='com.kunal.universalvideo.MainActivity'" "$GITHUB_WORKSPACE/aapt-badging.txt"
          echo 'APK IDENTITY GATE: PASS'

      - name: Real Android emulator startup gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -uo pipefail
            APK="$APK_FILE"
            PKG='com.kunal.universalvideo'
            ACT='com.kunal.universalvideo.MainActivity'
            mkdir -p "$GITHUB_WORKSPACE/runtime-final-gate"
            adb wait-for-device
            adb shell pm uninstall "$PKG" >/dev/null 2>&1 || true
            adb logcat -c
            adb install "$APK" > "$GITHUB_WORKSPACE/runtime-final-gate/install.txt" 2>&1
            adb shell am start -W -n "$PKG/$ACT" > "$GITHUB_WORKSPACE/runtime-final-gate/start.txt" 2>&1 || true
            sleep 8
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/runtime-final-gate/logcat.txt" 2>&1 || true
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/runtime-final-gate/activity.txt" 2>&1 || true
            adb shell dumpsys package "$PKG" > "$GITHUB_WORKSPACE/runtime-final-gate/package.txt" 2>&1 || true
            if grep -Eq 'You need to use a Theme\.AppCompat theme|FATAL EXCEPTION: main|Unable to start activity ComponentInfo\{com\.kunal\.universalvideo/com\.kunal\.universalvideo\.MainActivity\}' "$GITHUB_WORKSPACE/runtime-final-gate/logcat.txt"; then
              echo 'RUNTIME STARTUP GATE: FAIL'
              grep -E 'AndroidRuntime|FATAL EXCEPTION|Unable to start activity|Caused by:|Theme\.AppCompat|MainActivity' "$GITHUB_WORKSPACE/runtime-final-gate/logcat.txt" | tail -n 250 || true
              exit 1
            fi
            PID="$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo 'RUNTIME STARTUP GATE: FAIL - process not alive'
              tail -n 300 "$GITHUB_WORKSPACE/runtime-final-gate/logcat.txt" || true
              exit 1
            fi
            echo "RUNTIME STARTUP GATE: PASS - PID=$PID"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-FINAL-RUNTIME-GATED
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-final-gate-evidence-${{ github.run_number }}
          path: |
            aapt-badging.txt
            gradle-build.log
            gradle-wrapper.log
            runtime-final-gate/*
          if-no-files-found: ignore
