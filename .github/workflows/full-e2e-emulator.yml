name: Full E2E Emulator Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "30"
  ANDROID_ADB_SERVER_PORT: "5037"

jobs:
  full-e2e-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deterministic production safety repair
        shell: bash
        run: |
          set -euo pipefail
          python3 production_safety_patch.py
          grep -q 'Startup self-diagnostic failed' activity_fixed.kt
          grep -q 'Gallery output stream unavailable' activity_fixed.kt
          ! grep -q 'os!!' activity_fixed.kt

      - name: Run exhaustive 13-stage fault matrix before runtime testing
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/sequence-fault-matrix.sh

      - name: Upload fault matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-fault-matrix-evidence
          path: sequence-fault-matrix.txt
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Start ADB server before emulator
        shell: bash
        run: |
          set -euo pipefail
          adb kill-server || true
          adb start-server
          adb devices

      - name: Build verified APK using production build path
        shell: bash
        run: |
          set -euo pipefail
          python3 production_safety_patch.py
          python3 preflight_patch.py
          python3 mobile_connection_real_fix.py
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          mkdir -p artifact
          cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk

      - name: Start Android emulator and run full E2E gate
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -no-metrics -camera-back none -memory 3072
          disable-animations: true
          emulator-boot-timeout: 900
          shell: bash
          script: |
            set -euo pipefail
            adb start-server
            for i in $(seq 1 120); do
              state=$(adb -s emulator-5554 get-state 2>/dev/null || true)
              if [ "$state" = "device" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb -s emulator-5554 get-state)" = "device"
            bash .github/scripts/full-e2e-emulator.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-emulator-evidence
          path: |
            e2e-*.txt
            e2e-*.xml
            e2e-*.json
            e2e-*.log
            e2e-*.err
          if-no-files-found: warn

# Manual verification trigger: keep E2E gate runnable from Actions UI.
