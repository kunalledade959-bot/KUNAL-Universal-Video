name: Full E2E Emulator Gate

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "pro_repair_v3.py"
      - "preflight_patch.py"
      - "constructor_lifecycle_patch.py"
      - "stage11_hardening_v2.py"
      - ".github/scripts/full-e2e-emulator.sh"
      - ".github/scripts/self-healing-gate.sh"
      - ".github/scripts/final-production-user-flow.sh"
      - ".github/workflows/full-e2e-emulator.yml"
      - ".github/workflows/final-production-user-flow.yml"
  workflow_dispatch:

concurrency:
  group: kunal-universal-video-full-e2e-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-e2e-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK components with deterministic retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || { echo "SDKMANAGER_NOT_FOUND=$SDKMANAGER" >&2; exit 1; }

          # Accept licenses without letting the producer's expected SIGPIPE
          # masquerade as an sdkmanager failure under pipefail.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          [[ "$LICENSE_STATUS" == "0" ]] || { echo "SDK_LICENSE_ACCEPTANCE_FAILED=$LICENSE_STATUS" >&2; exit "$LICENSE_STATUS"; }

          install_package() {
            local pkg="$1"
            local attempt
            for attempt in 1 2 3 4; do
              echo "SDK_PACKAGE=$pkg ATTEMPT=$attempt"
              if "$SDKMANAGER" --install "$pkg"; then
                echo "SDK_PACKAGE=$pkg PASS"
                return 0
              fi
              echo "SDK_PACKAGE=$pkg ATTEMPT=$attempt FAILED" >&2
              # Remove only transient/corrupt download state before retrying.
              rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates" || true
              if (( attempt < 4 )); then sleep 5; fi
            done
            echo "SDK_PACKAGE=$pkg FAIL" >&2
            return 1
          }

          # Install independently so a corrupt/transient archive is isolated to
          # one component instead of invalidating the entire SDK transaction.
          install_package "platform-tools"
          install_package "platforms;android-35"
          install_package "build-tools;35.0.0"
          install_package "emulator"
          install_package "system-images;android-35;default;x86_64"

          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
          test -f "$SDK_ROOT/system-images/android-35/default/x86_64/package.xml"
          echo "ANDROID_SDK_COMPONENTS_VERIFIED=PASS"

      - name: Run authoritative production build + emulator + full E2E gate
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/self-healing-gate.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-emulator-evidence
          path: |
            e2e-*.txt
            e2e-*.xml
            e2e-*.json
            e2e-*.log
            avd-create.log
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          if-no-files-found: warn

# Manual verification trigger: keep E2E gate runnable from Actions UI.
