name: Full E2E Emulator Gate

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "pro_repair_v3.py"
      - "preflight_patch.py"
      - "stage11_hardening_v2.py"
      - ".github/scripts/full-e2e-emulator.sh"
      - ".github/workflows/full-e2e-emulator.yml"
  workflow_dispatch:

concurrency:
  group: kunal-universal-video-full-e2e-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-e2e-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Build verified APK using production build path
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          python3 stage11_hardening_v2.py
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          mkdir -p artifact
          cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk

      - name: Start Android emulator and run full E2E gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/full-e2e-emulator.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-emulator-evidence
          path: |
            e2e-*.txt
            e2e-*.xml
            e2e-*.json
            e2e-*.log
          if-no-files-found: warn

# Manual verification trigger: keep E2E gate runnable from Actions UI.
