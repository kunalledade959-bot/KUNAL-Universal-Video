name: Full E2E Emulator Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-e2e-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Give the headless emulator a little more time to exit cleanly so an
      # ADB/emu-kill race cannot turn a completed E2E gate into a CI failure.
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Build verified APK using production build path
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          grep -q '"status": "STATIC_AND_BUILD_VERIFIED"' KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          mkdir -p artifact
          cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk

      - name: Start Android emulator and run full E2E gate
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          # Explicit software rendering + no snapshot save avoids the two
          # hosted-runner paths that have produced flaky emulator/ADB state.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-audio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          pre-emulator-launch-script: |
            set -euo pipefail
            adb kill-server >/dev/null 2>&1 || true
            adb start-server >/dev/null
            adb version
          script: bash .github/scripts/full-e2e-emulator.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-emulator-evidence
          path: |
            e2e-*.txt
            e2e-*.xml
            e2e-*.json
            e2e-*.log
            e2e-*.err
          if-no-files-found: warn

# Manual verification trigger: keep E2E gate runnable from Actions UI.
