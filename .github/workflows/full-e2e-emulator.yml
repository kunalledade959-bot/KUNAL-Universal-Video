name: Full E2E Emulator Gate

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - "activity_fixed.kt"
      - "pro_repair_v3.py"
      - "preflight_patch.py"
      - "constructor_lifecycle_patch.py"
      - "stage11_hardening_v2.py"
      - ".github/scripts/full-e2e-emulator.sh"
      - ".github/scripts/self-healing-gate.sh"
      - ".github/scripts/final-production-user-flow.sh"
      - ".github/workflows/full-e2e-emulator.yml"
      - ".github/workflows/final-production-user-flow.yml"
  workflow_dispatch:

concurrency:
  group: kunal-universal-video-full-e2e-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-e2e-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64"

      - name: Run authoritative production build + emulator + full E2E gate
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/self-healing-gate.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-emulator-evidence
          path: |
            e2e-*.txt
            e2e-*.xml
            e2e-*.json
            e2e-*.log
            avd-create.log
            KUNAL_UNIVERSAL_VIDEO_PRO_V3_REPORT.json
          if-no-files-found: warn

# Manual verification trigger: keep E2E gate runnable from Actions UI.
