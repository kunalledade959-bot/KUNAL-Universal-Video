name: Night Doctor - Autonomous Quality Engineer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/one-shot/night-doctor.trigger'

concurrency:
  group: kunal-night-doctor
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  copilot-requests: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record engineering baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p doctor-evidence
          cat > doctor-evidence/QUALITY_BASELINE.md <<'EOF'
          # KUNAL Universal Video - Verification Contract
          - Evidence beats source-pattern presence.
          - Unit/component tests are the high-volume base; feature/application/release tests add production fidelity.
          - Emulator tests complement real-device validation and never replace it.
          - Android framework behavior requires instrumented/device tests.
          - Parser/media/security boundaries require malformed-input and fuzz coverage.
          - Performance claims require instrumentation and, where hardware matters, physical-device evidence.
          - Warnings, skips, unavailable dependencies, and infrastructure failures are never PASS.
          - A repair is promoted only after its narrow test and full regression both pass.
          - The 13-stage gate remains fail-closed and persisted evidence must remain durable.
          - Never weaken an assertion to make CI green.
          EOF

      - name: Research current Android guidance
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p doctor-evidence/research
          curl -fsSL --max-time 20 https://developer.android.com/training/testing/fundamentals/strategies -o doctor-evidence/research/testing-strategies.html
          curl -fsSL --max-time 20 https://developer.android.com/studio/run/device -o doctor-evidence/research/real-device.html
          curl -fsSL --max-time 20 https://developer.android.com/develop/adaptive-apps/quality-guidelines/core-app-quality -o doctor-evidence/research/core-quality.html
          curl -fsSL --max-time 20 https://source.android.com/docs/security/best-practices/app -o doctor-evidence/research/security.html

      - name: Static exhaustive audit
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [[ -x .github/scripts/full-system-exhaustive-audit.sh ]]; then
            .github/scripts/full-system-exhaustive-audit.sh
            rc=$?
          else
            echo 'AUDIT SCRIPT MISSING' | tee doctor-evidence/static-audit.txt
            rc=2
          fi
          cp FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt doctor-evidence/static-audit.txt 2>/dev/null || true
          cp FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt doctor-evidence/static-errors.txt 2>/dev/null || true
          echo "static_audit_rc=$rc" >> doctor-evidence/static-audit.txt
          exit "$rc"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Autonomous diagnosis and repair
        id: repair
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          copilot --autopilot --yolo --max-autopilot-continues 12 -p '
          You are the senior Android architect and repair engineer for KUNAL Universal Video.
          Work evidence-first. Inspect the whole repository relevant to the product, the 13-stage contracts, doctor-evidence, Android source, build scripts, tests, permissions, lifecycle paths, persistence, media pipeline, controller bridge, and CI diagnostics.
          The objective is production correctness, not merely a green source scan.
          Identify root causes and distinguish app defects from CI/emulator/infrastructure defects.
          Repair only evidence-backed defects. Preserve package com.kunal.universalvideo, the 13-stage architecture, working behavior, and the real mobile/controller/video-generation intent.
          Never edit .github/workflows, secrets, or credentials. Never weaken assertions, skip tests, manufacture evidence, or turn infrastructure failures into PASS.
          For Stage 2 prove a real controller/session handshake. For Stage 3 prove installed and launchable target selection. For Stage 6/7 prove live foreground target plus actual AccessibilityNodeInfo evidence. For Stage 10 prove actual audio and recording lifecycle. For Stage 11 validate media tracks and container metadata, not file size alone. For Stage 12 repair only known recoverable media faults and re-verify from scratch. For Stage 13 verify final MediaStore export and integrity evidence.
          Run the narrowest relevant tests after each repair, then build and runtime tests. Stress deterministic state/persistence/parsing/validation invariants up to 10000 iterations where practical. Exercise empty, Unicode, malformed, timeout, cancellation, restart, process-death, and recovery cases.
          If one test fails, preserve evidence and continue independent diagnostics rather than abandoning the engineering pass.
          Do not claim physical-device verification from an emulator. Do not publish or commit a project repair unless all available relevant verification gates pass.
          Write doctor-evidence/DOCTOR_REPORT.md with inspected files, root causes, alternatives considered, repairs, exact tests and iteration counts, blockers, and a strict VERIFIED or NOT_VERIFIED verdict.
          '
          rc=$?
          echo "copilot_rc=$rc" | tee doctor-evidence/copilot-status.txt
          exit "$rc"

      - name: Rebuild and emulator gate
        id: gate
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            rm -rf verification-package
            mkdir -p verification-package
            if [[ -f KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip ]]; then
              unzip -q KUNAL_UNIVERSAL_VIDEO_ANDROID_PROJECT_FIXED.zip -d verification-package
              PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
            else
              PROJECT_DIR="$(find . -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
            fi
            test -n "$PROJECT_DIR"
            export PROJECT_DIR
            bash "$GITHUB_WORKSPACE/.github/scripts/runtime-diagnostic.sh"

      - name: Enforce fail-closed verdict and collect diff
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > doctor-evidence/git-status.txt
          git diff --name-only > doctor-evidence/changed-files.txt
          if git diff --name-only | grep -E '^\.github/workflows/' >/dev/null; then
            echo 'FORBIDDEN_WORKFLOW_CHANGE' | tee doctor-evidence/VERDICT.txt
            exit 1
          fi
          echo "STATIC_AUDIT=${{ steps.static.outcome }}" | tee doctor-evidence/VERDICT.txt
          echo "REPAIR=${{ steps.repair.outcome }}" | tee -a doctor-evidence/VERDICT.txt
          echo "RUNTIME_GATE=${{ steps.gate.outcome }}" | tee -a doctor-evidence/VERDICT.txt
          if [[ "${{ steps.gate.outcome }}" != "success" ]]; then
            echo 'NOT_VERIFIED' | tee -a doctor-evidence/VERDICT.txt
          else
            echo 'RUNTIME_GATE_PASS' | tee -a doctor-evidence/VERDICT.txt
          fi

      - name: Commit only verified project repair
        if: ${{ steps.gate.outcome == 'success' && steps.repair.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kunalledade959-bot'
          git config user.email 'kunalledade959-bot@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows || true
          if git diff --cached --quiet; then
            echo 'No verified project changes.'
          else
            git commit -m 'fix: autonomous overnight production hardening'
            git push origin main
          fi

      - name: Upload doctor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-night-doctor-${{ github.run_number }}
          path: doctor-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Final verdict
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.gate.outcome }}" == "success" && "${{ steps.repair.outcome }}" == "success" ]]; then
            echo 'VERDICT=VERIFIED_RUNTIME_GATE'
          else
            echo 'VERDICT=NOT_VERIFIED'
            exit 1
          fi
