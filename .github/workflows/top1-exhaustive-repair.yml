name: Top1 Exhaustive Repair Loop

on:
  push:
    paths:
      - ".github/one-shot/top1-exhaustive-repair.trigger"
  workflow_dispatch:

concurrency:
  group: kunal-top1-exhaustive-repair
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 1800
    steps:
      - name: Checkout exact repair baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repair intelligence
        run: npm install -g @github/copilot

      - name: Initialize isolated controller and trusted verifier
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/kunal-top1-repair-${GITHUB_RUN_ID}"
          TRUSTED_DIR="$RUNNER_TEMP/kunal-top1-trusted-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR" "$TRUSTED_DIR"
          cp -a .github/scripts "$TRUSTED_DIR/scripts"
          chmod +x "$TRUSTED_DIR/scripts/full-system-exhaustive-audit.sh"
          printf '# Top1 Exhaustive Repair Root-Cause Report\n\n' > "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md"
          printf '%s\n' 'Evidence, queue, and trusted verifier are outside the git worktree.' >> "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md"

      - name: Run exhaustive discovery without stopping
        shell: bash
        run: |
          set +e
          EVIDENCE_DIR="$RUNNER_TEMP/kunal-top1-repair-${GITHUB_RUN_ID}"
          TRUSTED_AUDIT="$RUNNER_TEMP/kunal-top1-trusted-${GITHUB_RUN_ID}/scripts/full-system-exhaustive-audit.sh"
          bash "$TRUSTED_AUDIT" > "$EVIDENCE_DIR/discovery.log" 2>&1
          rc=$?
          cp FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt "$EVIDENCE_DIR/DISCOVERY_AUDIT.txt" 2>/dev/null || true
          cp FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt "$EVIDENCE_DIR/DISCOVERY_ERRORS.txt" 2>/dev/null || true
          printf 'DISCOVERY_RC=%s\n' "$rc" > "$EVIDENCE_DIR/discovery-status.txt"
          cat "$EVIDENCE_DIR/discovery.log"
          exit 0

      - name: Build immutable ordered repair queue
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/kunal-top1-repair-${GITHUB_RUN_ID}"
          python3 - "$EVIDENCE_DIR" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          src=Path('FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt')
          lines=src.read_text(errors='replace').splitlines() if src.exists() else []
          seen=set(); ordered=[]
          for line in lines:
              if (line.startswith('FAIL |') or line.startswith('WARN |')) and line not in seen:
                  seen.add(line); ordered.append(line)
          (root/'repair-queue.txt').write_text('\n'.join(ordered)+'\n')
          print(f'REPAIR_QUEUE_COUNT={len(ordered)}')
          for i,x in enumerate(ordered,1): print(f'{i:03d} | {x}')
          PY

      - name: Sequential Top1 repair with immutable checkpoints and regression proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/kunal-top1-repair-${GITHUB_RUN_ID}"
          TRUSTED_AUDIT="$RUNNER_TEMP/kunal-top1-trusted-${GITHUB_RUN_ID}/scripts/full-system-exhaustive-audit.sh"
          checkpoint="$(git rev-parse HEAD)"
          queue_failed=0
          n=0

          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            n=$((n+1))
            id=$(printf '%03d' "$n")
            issue_dir="$EVIDENCE_DIR/issue-$id"
            mkdir -p "$issue_dir"
            git reset --hard "$checkpoint" >/dev/null 2>&1
            git clean -fd >/dev/null 2>&1
            before="$checkpoint"
            printf '# Issue %s\n\n**Finding:** %s\n\n**Baseline:** `%s`\n\n' "$id" "$issue" "$before" > "$issue_dir/issue.md"

            rm -f FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt
            bash "$TRUSTED_AUDIT" > "$issue_dir/baseline-audit.log" 2>&1
            baseline_rc=$?
            cp FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt "$issue_dir/baseline-audit.txt" 2>/dev/null || true
            cp FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt "$issue_dir/baseline-errors.txt" 2>/dev/null || true
            echo "BASELINE_AUDIT_RC=$baseline_rc" >> "$issue_dir/issue.md"

            copilot --autopilot --yolo --max-autopilot-continues 12 -p "
            Repair ONLY this exhaustive audit finding in KUNAL Universal Video:
            $issue
            Inspect the actual repository and prove the root cause before editing.
            Replace weak mechanisms with the strongest production-grade mechanism justified by the platform and repository.
            Preserve working functionality and the locked 13-stage contract.
            Never weaken PASS gates, hide errors, fabricate evidence, pad/corrupt media, or make cosmetic changes.
            Do not modify unrelated components or repair-evidence files.
            Do not modify audit/verifier infrastructure unless the finding itself explicitly requires it.
            Add or strengthen an independent verification for this root cause where practical.
            Finish only when the real correction exists in the worktree.
            " > "$issue_dir/copilot.log" 2>&1
            repair_rc=$?
            echo "COPILOT_RC=$repair_rc" >> "$issue_dir/issue.md"

            if [ "$repair_rc" -ne 0 ]; then
              printf '\n## Issue %s\n- Finding: %s\n- Result: REPAIR_AGENT_FAILED\n- Agent rc: %s\n- Baseline preserved: `%s`\n\n' "$id" "$issue" "$repair_rc" "$before" >> "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md"
              git reset --hard "$checkpoint" >/dev/null 2>&1
              git clean -fd >/dev/null 2>&1
              queue_failed=1
              continue
            fi

            git diff --binary > "$issue_dir/proposed.patch"
            git status --short > "$issue_dir/proposed-status.txt"
            rm -f FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt
            bash "$TRUSTED_AUDIT" > "$issue_dir/verify.log" 2>&1
            verify_rc=$?
            cp FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt "$issue_dir/verify-audit.txt" 2>/dev/null || true
            cp FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt "$issue_dir/verify-errors.txt" 2>/dev/null || true

            python3 - "$issue" "$issue_dir" <<'PY'
          from pathlib import Path
          import sys
          issue=sys.argv[1]; out=Path(sys.argv[2])
          def load(p):
              if not Path(p).exists(): return set()
              return {x for x in Path(p).read_text(errors='replace').splitlines() if x.startswith('FAIL |') or x.startswith('WARN |')}
          before=load(out/'baseline-errors.txt'); after=load(out/'verify-errors.txt')
          exact=issue in after; added=sorted(after-before); removed=sorted(before-after)
          (out/'baseline-count.txt').write_text(str(len(before))+'\n')
          (out/'remaining-count.txt').write_text(str(len(after))+'\n')
          (out/'exact-finding-present.txt').write_text(str(exact)+'\n')
          (out/'added-findings.txt').write_text('\n'.join(added)+'\n')
          (out/'removed-findings.txt').write_text('\n'.join(removed)+'\n')
          (out/'remaining-findings.txt').write_text('\n'.join(sorted(after))+'\n')
          print(f'BASELINE_FINDINGS={len(before)}')
          print(f'REMAINING_FINDINGS={len(after)}')
          print(f'EXACT_FINDING_PRESENT={exact}')
          print(f'NEW_FINDINGS={len(added)}')
          PY

            baseline_count="$(cat "$issue_dir/baseline-count.txt" 2>/dev/null || echo 999999)"
            remaining="$(cat "$issue_dir/remaining-count.txt" 2>/dev/null || echo 999999)"
            exact="$(cat "$issue_dir/exact-finding-present.txt" 2>/dev/null || echo true)"
            added="$(grep -c '^' "$issue_dir/added-findings.txt" 2>/dev/null || echo 0)"

            if [ "$baseline_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ] || [ "$exact" = "True" ] || [ "$exact" = "true" ] || [ "$added" -ne 0 ]; then
              printf '\n## Issue %s\n- Finding: %s\n- Result: REPAIR_REJECTED_BY_INDEPENDENT_VERIFIER\n- Baseline audit rc: %s\n- Verifier rc: %s\n- Exact finding still present: %s\n- Baseline findings: %s\n- Remaining findings: %s\n- New findings introduced: %s\n- Baseline restored: `%s`\n\n' "$id" "$issue" "$baseline_rc" "$verify_rc" "$exact" "$baseline_count" "$remaining" "$added" "$before" >> "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md"
              git reset --hard "$checkpoint" >/dev/null 2>&1
              git clean -fd >/dev/null 2>&1
              queue_failed=1
              continue
            fi

            if git diff --quiet; then
              result="NO_CHANGE_BUT_FINDING_CLEARED"
              queue_failed=1
              git reset --hard "$checkpoint" >/dev/null 2>&1
              git clean -fd >/dev/null 2>&1
            else
              git add -A
              git commit -m "fix: top1 repair issue $id" >/dev/null 2>&1
              commit_rc=$?
              if [ "$commit_rc" -ne 0 ]; then
                result="REPAIR_COMMIT_FAILED"
                queue_failed=1
                git reset --hard "$checkpoint" >/dev/null 2>&1
                git clean -fd >/dev/null 2>&1
              else
                git push origin HEAD:main >/dev/null 2>&1
                push_rc=$?
                if [ "$push_rc" -eq 0 ]; then
                  checkpoint="$(git rev-parse HEAD)"
                  result="REPAIRED_AND_CHECKPOINT_ACCEPTED"
                else
                  result="REPAIR_PUSH_FAILED"
                  queue_failed=1
                  git reset --hard "$checkpoint" >/dev/null 2>&1
                  git clean -fd >/dev/null 2>&1
                fi
              fi
            fi

            printf '\n## Issue %s\n- Finding: %s\n- Result: %s\n- Baseline audit rc: %s\n- Verifier rc: %s\n- Exact finding still present: %s\n- Baseline findings: %s\n- Remaining findings: %s\n- New findings introduced: %s\n- Baseline: `%s`\n- Accepted checkpoint: `%s`\n\n' "$id" "$issue" "$result" "$baseline_rc" "$verify_rc" "$exact" "$baseline_count" "$remaining" "$added" "$before" "$checkpoint" >> "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md"
          done < "$EVIDENCE_DIR/repair-queue.txt"

          printf 'QUEUE_COMPLETE=YES\nFINAL_CHECKPOINT=%s\nQUEUE_HAD_ISSUES=%s\n' "$checkpoint" "$queue_failed" > "$EVIDENCE_DIR/queue-complete.txt"
          exit 0

      - name: Final exhaustive verification and report sealing
        if: always()
        shell: bash
        run: |
          set +e
          EVIDENCE_DIR="$RUNNER_TEMP/kunal-top1-repair-${GITHUB_RUN_ID}"
          TRUSTED_AUDIT="$RUNNER_TEMP/kunal-top1-trusted-${GITHUB_RUN_ID}/scripts/full-system-exhaustive-audit.sh"
          bash "$TRUSTED_AUDIT" > "$EVIDENCE_DIR/final-audit.log" 2>&1
          rc=$?
          cp FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt "$EVIDENCE_DIR/FINAL_AUDIT.txt" 2>/dev/null || true
          cp FULL_SYSTEM_EXHAUSTIVE_ERRORS.txt "$EVIDENCE_DIR/FINAL_ERRORS.txt" 2>/dev/null || true
          printf '\n## Final verification\n- Audit rc: %s\n' "$rc" >> "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md"
          grep -E 'CHECKS_TOTAL|CHECKS_PASS|CHECKS_WARN|CHECKS_FAIL|FINAL_VERDICT' FULL_SYSTEM_EXHAUSTIVE_AUDIT.txt >> "$EVIDENCE_DIR/ROOT_CAUSE_REPORT.md" 2>/dev/null || true
          find "$EVIDENCE_DIR" -type f ! -name EVIDENCE_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/EVIDENCE_SHA256.txt" 2>/dev/null || true
          exit 0

      - name: Upload complete repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top1-exhaustive-repair-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/kunal-top1-repair-${{ github.run_id }}/
          if-no-files-found: error
          compression-level: 6

      - name: Final status
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/kunal-top1-repair-${GITHUB_RUN_ID}"
          cat "$EVIDENCE_DIR/queue-complete.txt" 2>/dev/null || true
          if grep -q '^QUEUE_HAD_ISSUES=0$' "$EVIDENCE_DIR/queue-complete.txt" 2>/dev/null; then
            echo 'TOP1_REPAIR_STATUS=ALL_QUEUED_ISSUES_ACCEPTED'
            exit 0
          fi
          echo 'TOP1_REPAIR_STATUS=ONE_OR_MORE_ISSUES_FAILED_OR_REJECTED'
          exit 1
