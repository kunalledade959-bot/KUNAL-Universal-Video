name: Production Truth Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  truth-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run canonical 13-stage audit
        run: python3 .github/scripts/production_truth_audit.py | tee production-truth-audit.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-truth-audit
          path: production-truth-audit.json
          if-no-files-found: error
