name: Runtime Theme Fix - KUNAL Universal Video

on:
  push:
    paths:
      - ".github/workflows/runtime-theme-fix.yml"
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "ci-repair/UniversalAccessibilityService.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fixed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract proven Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
          test -s "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q "$ZIP_FILE" -d verification-package

          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          APP_DIR="$PROJECT_DIR/app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          APP_BUILD="$APP_DIR/build.gradle.kts"
          MAIN_ACTIVITY="$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$APP_BUILD"
          test -f "$MANIFEST"
          test -f "$MAIN_ACTIVITY"

          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_DIR=$APP_DIR"
            echo "MANIFEST=$MANIFEST"
            echo "APP_BUILD=$APP_BUILD"
            echo "MAIN_ACTIVITY=$MAIN_ACTIVITY"
          } >> "$GITHUB_ENV"

          echo "PASS: proven app path located: $APP_DIR"

      - name: Apply verified AccessibilityService source
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$APP_DIR/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          test -s ci-repair/UniversalAccessibilityService.kt
          test -f "$TARGET"
          cp ci-repair/UniversalAccessibilityService.kt "$TARGET"
          cmp -s ci-repair/UniversalAccessibilityService.kt "$TARGET"
          echo "PASS: AccessibilityService source installed"

      - name: Apply runtime startup fix directly to app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("${APP_DIR}")
          manifest = Path("${MANIFEST}")
          build = Path("${APP_BUILD}")
          main = Path("${MAIN_ACTIVITY}")

          # 1) Make the real MainActivity AppCompat-compatible.
          text = main.read_text(encoding="utf-8")
          if "AppCompatActivity" not in text:
              text = text.replace("import android.app.Activity", "import androidx.appcompat.app.AppCompatActivity")
              text = text.replace("import android.app.Activity\n", "")
              text = re.sub(r'(:\\s*)(?:Activity|ComponentActivity)(\\s*\\()', r'\\1AppCompatActivity\\2', text, count=1)
              if "AppCompatActivity" not in text:
                  raise SystemExit(f"Could not convert MainActivity to AppCompatActivity: {main}")
              main.write_text(text, encoding="utf-8")

          # 2) Add AppCompat dependency to the actual app module only.
          gradle = build.read_text(encoding="utf-8")
          if "androidx.appcompat:appcompat" not in gradle:
              dep = '    implementation("androidx.appcompat:appcompat:1.7.0")\n'
              m = re.search(r'(?m)^dependencies\\s*\\{', gradle)
              if m:
                  pos = m.end()
                  gradle = gradle[:pos] + "\n" + dep + gradle[pos:]
              else:
                  gradle += '\n\ndependencies {\n' + dep + '}\n'
              build.write_text(gradle, encoding="utf-8")

          # 3) Install a deterministic AppCompat startup theme without destroying existing resources.
          values = app / "src/main/res/values"
          values.mkdir(parents=True, exist_ok=True)
          theme_file = values / "kunal_runtime_theme.xml"
          theme_file.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n''', encoding="utf-8")

          # 4) Apply the same theme to application and MainActivity in the actual manifest.
          xml = manifest.read_text(encoding="utf-8")
          if not re.search(r'<application\\b', xml):
              raise SystemExit(f"No application tag: {manifest}")
          theme = "@style/KunalRuntimeTheme"

          def theme_tag(m):
              tag = m.group(0)
              if re.search(r'android:theme\\s*=\\s*"[^"]*"', tag):
                  return re.sub(r'android:theme\\s*=\\s*"[^"]*"', f'android:theme="{theme}"', tag, count=1)
              return tag[:-1] + f' android:theme="{theme}">'

          xml = re.sub(r'<application\\b[^>]*>', theme_tag, xml, count=1, flags=re.S)
          activity = re.compile(r'<activity\\b(?=[^>]*android:name\\s*=\\s*"[^"]*MainActivity")[^>]*>', re.S)
          if not activity.search(xml):
              raise SystemExit(f"MainActivity manifest entry not found: {manifest}")
          xml = activity.sub(theme_tag, xml, count=1)
          manifest.write_text(xml, encoding="utf-8")

          # 5) Hard verification before Gradle starts.
          final_main = main.read_text(encoding="utf-8")
          final_manifest = manifest.read_text(encoding="utf-8")
          final_gradle = build.read_text(encoding="utf-8")
          final_theme = theme_file.read_text(encoding="utf-8")
          assert "AppCompatActivity" in final_main
          assert "androidx.appcompat:appcompat" in final_gradle
          assert "@style/KunalRuntimeTheme" in final_manifest
          assert "KunalRuntimeTheme" in final_theme
          assert "Theme.AppCompat.Light.NoActionBar" in final_theme
          print("PASS: runtime startup contract applied to the actual app")
          PY

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AppCompatActivity" "$MAIN_ACTIVITY"
          grep -q "androidx.appcompat:appcompat" "$APP_BUILD"
          grep -q "@style/KunalRuntimeTheme" "$MANIFEST"
          grep -q "KunalRuntimeTheme" "$APP_DIR/src/main/res/values/kunal_runtime_theme.xml"
          grep -q "Theme.AppCompat.Light.NoActionBar" "$APP_DIR/src/main/res/values/kunal_runtime_theme.xml"
          echo "PASS: static startup verification"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build fixed APK directly
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          rm -f ./gradlew ./gradlew.bat
          gradle :wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee "$GITHUB_WORKSPACE/gradle-wrapper.log"
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify and upload APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$APP_DIR/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "PASS: fixed APK built and ZIP-valid: $APK_FILE"

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK-runtime-fixed
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Failure diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci-results
          {
            echo "# Runtime startup fix diagnosis"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Status: ${{ job.status }}"
            echo "Project: ${PROJECT_DIR:-unknown}"
            echo "App: ${APP_DIR:-unknown}"
            echo "Manifest: ${MANIFEST:-unknown}"
            echo "MainActivity: ${MAIN_ACTIVITY:-unknown}"
            echo
            if [ -f gradle-build.log ]; then
              grep -E -i "(FAILURE:|What went wrong:|Execution failed|Could not resolve|Could not find|Unresolved reference|e: |error:|Caused by:|Exception|manifest merger failed)" gradle-build.log | tail -n 160 || true
              echo
              tail -n 160 gradle-build.log || true
            fi
          } > ci-results/runtime-fixed-diagnosis.md

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-fixed-diagnostics-${{ github.run_number }}
          path: |
            ci-results/runtime-fixed-diagnosis.md
            gradle-build.log
            gradle-wrapper.log
          if-no-files-found: ignore
