name: Runtime Theme Fix - KUNAL Universal Video

on:
  push:
    paths:
      - ".github/workflows/runtime-theme-fix.yml"
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "ci-repair/UniversalAccessibilityService.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fixed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original project
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip
          rm -rf verification-package
          mkdir -p verification-package
          unzip -q KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply verified AccessibilityService source
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          test -s ci-repair/UniversalAccessibilityService.kt
          test -f "$TARGET"
          cp ci-repair/UniversalAccessibilityService.kt "$TARGET"
          cmp -s ci-repair/UniversalAccessibilityService.kt "$TARGET"

      - name: Permanently enforce AppCompat startup theme
        shell: bash
        run: |
          set -euo pipefail
          export PROJECT_DIR
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ['PROJECT_DIR'])
          app = root / 'app'
          manifest = app / 'src/main/AndroidManifest.xml'
          build = app / 'build.gradle.kts'
          themes = app / 'src/main/res/values/themes.xml'

          main = root / 'app/src/main/java/com/kunal/universalvideo/MainActivity.kt'
          text = main.read_text(encoding='utf-8')
          if 'AppCompatActivity' not in text:
              raise SystemExit('MainActivity is not AppCompatActivity; refusing an unrelated theme change')

          # Keep the existing project and dependencies; only add AppCompat if it is truly absent.
          gradle = build.read_text(encoding='utf-8')
          if 'androidx.appcompat:appcompat' not in gradle:
              m = re.search(r'(?m)^dependencies\\s*\\{', gradle)
              if not m:
                  raise SystemExit('Could not locate dependencies block in app/build.gradle.kts')
              pos = m.end()
              gradle = gradle[:pos] + '\n    implementation("androidx.appcompat:appcompat:1.7.0")' + gradle[pos:]
              build.write_text(gradle, encoding='utf-8')

          themes.parent.mkdir(parents=True, exist_ok=True)
          themes.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.KunalUniversalVideo" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n''', encoding='utf-8')

          manifest_text = manifest.read_text(encoding='utf-8')
          theme = '@style/Theme.KunalUniversalVideo'

          def set_theme_on_tag(match):
              tag = match.group(1)
              if re.search(r'android:theme\\s*=\\s*"[^"]*"', tag):
                  tag = re.sub(r'android:theme\\s*=\\s*"[^"]*"', f'android:theme="{theme}"', tag)
              else:
                  tag += f' android:theme="{theme}"'
              return '<' + tag + '>'

          app_pat = re.compile(r'<application\\b([^>]*)>', re.S)
          if not app_pat.search(manifest_text):
              raise SystemExit('No application tag found')
          manifest_text = app_pat.sub(set_theme_on_tag, manifest_text, count=1)

          activity_pat = re.compile(r'<activity\\b(?=[^>]*android:name\\s*=\\s*"(?:[^".]*/)?(?:\\.?MainActivity)"|[^>]*android:name\\s*=\\s*"[^"]*\\.MainActivity")[^>]*>', re.S)
          if not activity_pat.search(manifest_text):
              # Fallback: find any activity whose name contains MainActivity.
              activity_pat = re.compile(r'<activity\\b(?=[^>]*android:name\\s*=\\s*"[^"]*MainActivity")[^>]*>', re.S)
          if not activity_pat.search(manifest_text):
              raise SystemExit('MainActivity manifest entry not found')
          manifest_text = activity_pat.sub(set_theme_on_tag, manifest_text, count=1)

          manifest.write_text(manifest_text, encoding='utf-8')

          # Fail closed if the compatibility contract is not present.
          final_manifest = manifest.read_text(encoding='utf-8')
          if theme not in final_manifest:
              raise SystemExit('AppCompat theme was not installed in manifest')
          if 'Theme.AppCompat.Light.NoActionBar' not in themes.read_text(encoding='utf-8'):
              raise SystemExit('AppCompat theme resource was not created')
          print('PASS: MainActivity/AppCompat theme contract enforced')
          PY

      - name: Static startup contract audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AppCompatActivity" "$PROJECT_DIR/app/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          grep -q "Theme.KunalUniversalVideo" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q "Theme.AppCompat.Light.NoActionBar" "$PROJECT_DIR/app/src/main/res/values/themes.xml"
          grep -q "androidx.appcompat:appcompat" "$PROJECT_DIR/app/build.gradle.kts"
          echo "PASS: startup theme audit"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          rm -f ./gradlew ./gradlew.bat
          gradle :wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee "$GITHUB_WORKSPACE/gradle-wrapper.log"
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "PASS: fixed APK is present and ZIP-valid"

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK-runtime-theme-fixed
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Failure diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci-results
          {
            echo "# Runtime theme fix build diagnosis"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Status: ${{ job.status }}"
            echo
            if [ -f gradle-build.log ]; then
              grep -E -i "(FAILURE:|Execution failed|Caused by:|Exception|error:|e: )" gradle-build.log | tail -n 120 || true
              echo
              tail -n 120 gradle-build.log || true
            fi
          } > ci-results/runtime-theme-fix-diagnosis.md

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-theme-fix-diagnostics-${{ github.run_number }}
          path: |
            ci-results/runtime-theme-fix-diagnosis.md
            gradle-build.log
            gradle-wrapper.log
          if-no-files-found: ignore
