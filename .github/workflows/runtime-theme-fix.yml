name: Runtime Theme Fix - KUNAL Universal Video

on:
  push:
    paths:
      - ".github/workflows/runtime-theme-fix.yml"
      - "KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip"
      - "ci-repair/UniversalAccessibilityService.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fixed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract proven app
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip
          rm -rf verification-package
          mkdir verification-package
          unzip -q KUNAL_CHROMATOON_7LAYER_GITHUB_PACKAGE.zip -d verification-package
          PROJECT_DIR="$(find verification-package -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          APP_DIR="$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$APP_DIR/build.gradle.kts"
          test -f "$APP_DIR/src/main/AndroidManifest.xml"
          test -f "$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          {
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "APP_DIR=$APP_DIR"
            echo "MANIFEST=$APP_DIR/src/main/AndroidManifest.xml"
            echo "APP_BUILD=$APP_DIR/build.gradle.kts"
            echo "MAIN_ACTIVITY=$APP_DIR/src/main/java/com/kunal/universalvideo/MainActivity.kt"
          } >> "$GITHUB_ENV"
          echo "PASS: direct proven app path = $APP_DIR"

      - name: Install verified AccessibilityService
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$APP_DIR/src/main/java/com/kunal/universalvideo/UniversalAccessibilityService.kt"
          test -s ci-repair/UniversalAccessibilityService.kt
          test -f "$TARGET"
          cp ci-repair/UniversalAccessibilityService.kt "$TARGET"
          cmp -s ci-repair/UniversalAccessibilityService.kt "$TARGET"

      - name: Repair startup crash contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          app=Path(os.environ['APP_DIR'])
          manifest=Path(os.environ['MANIFEST'])
          build=Path(os.environ['APP_BUILD'])
          main=Path(os.environ['MAIN_ACTIVITY'])

          # MainActivity -> AppCompatActivity when necessary.
          s=main.read_text(encoding='utf-8')
          if 'AppCompatActivity' not in s:
              if 'import android.app.Activity' in s:
                  s=s.replace('import android.app.Activity','import androidx.appcompat.app.AppCompatActivity')
              elif 'import androidx.appcompat.app.AppCompatActivity' not in s:
                  lines=s.splitlines(True)
                  for i,line in enumerate(lines):
                      if line.startswith('package '):
                          lines.insert(i+1,'\nimport androidx.appcompat.app.AppCompatActivity\n')
                          break
                  s=''.join(lines)
              s=re.sub(r':\s*(?:Activity|ComponentActivity)\s*\(', ': AppCompatActivity(', s, count=1)
              if 'AppCompatActivity' not in s or not re.search(r'class\s+MainActivity[^\n]*AppCompatActivity',s):
                  raise SystemExit('MainActivity could not be converted safely')
              main.write_text(s,encoding='utf-8')

          # AppCompat dependency in the real app module.
          g=build.read_text(encoding='utf-8')
          if 'androidx.appcompat:appcompat' not in g:
              dep='\n    implementation("androidx.appcompat:appcompat:1.7.0")'
              m=re.search(r'(?m)^\s*dependencies\s*\{',g)
              if not m:
                  raise SystemExit('dependencies block not found in app/build.gradle.kts')
              p=g.find('\n',m.start())+1
              g=g[:p]+dep+'\n'+g[p:]
              build.write_text(g,encoding='utf-8')

          # Dedicated startup theme.
          values=app/'src/main/res/values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'kunal_runtime_theme.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="KunalRuntimeTheme" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          ''',encoding='utf-8')

          # Apply theme to application and MainActivity.
          x=manifest.read_text(encoding='utf-8')
          if not re.search(r'<application\b',x): raise SystemExit('No application tag in actual manifest')
          theme='@style/KunalRuntimeTheme'
          def add(m):
              tag=m.group(0)
              if re.search(r'android:theme\s*=\s*"[^"]*"',tag):
                  return re.sub(r'android:theme\s*=\s*"[^"]*"',f'android:theme="{theme}"',tag,count=1)
              return tag[:-1]+f' android:theme="{theme}">'
          x=re.sub(r'<application\b[^>]*>',add,x,count=1,flags=re.S)
          ap=r'<activity\b(?=[^>]*android:name\s*=\s*"[^"]*MainActivity")[^>]*>'
          if not re.search(ap,x,re.S): raise SystemExit('MainActivity manifest entry not found')
          x=re.sub(ap,add,x,count=1,flags=re.S)
          manifest.write_text(x,encoding='utf-8')

          # Hard pre-build verification.
          assert 'AppCompatActivity' in main.read_text(encoding='utf-8')
          assert 'androidx.appcompat:appcompat' in build.read_text(encoding='utf-8')
          assert theme in manifest.read_text(encoding='utf-8')
          assert 'Theme.AppCompat.Light.NoActionBar' in (values/'kunal_runtime_theme.xml').read_text(encoding='utf-8')
          print('PASS: startup crash repair applied to actual app')
          PY

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AppCompatActivity' "$MAIN_ACTIVITY"
          grep -q 'androidx.appcompat:appcompat' "$APP_BUILD"
          grep -q '@style/KunalRuntimeTheme' "$MANIFEST"
          grep -q 'Theme.AppCompat.Light.NoActionBar' "$APP_DIR/src/main/res/values/kunal_runtime_theme.xml"
          echo 'PASS: all startup checks'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK directly
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          rm -f gradlew gradlew.bat
          gradle :wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee "$GITHUB_WORKSPACE/gradle-wrapper.log"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$APP_DIR/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "PASS: fixed APK ready: $APK_FILE"

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: KUNAL-Universal-Video-APK-runtime-fixed
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Automatic failure evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci-results
          {
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Status: ${{ job.status }}"
            echo "Project: ${PROJECT_DIR:-unknown}"
            echo "App: ${APP_DIR:-unknown}"
            echo
            grep -E -i '(FAILURE:|What went wrong:|Execution failed|Could not resolve|Could not find|Unresolved reference|e: |error:|Caused by:|Exception|manifest merger failed)' gradle-build.log 2>/dev/null | tail -n 160 || true
            tail -n 160 gradle-build.log 2>/dev/null || true
          } > ci-results/runtime-fixed-diagnosis.md

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-fixed-diagnostics-${{ github.run_number }}
          path: |
            ci-results/runtime-fixed-diagnosis.md
            gradle-build.log
            gradle-wrapper.log
          if-no-files-found: ignore
