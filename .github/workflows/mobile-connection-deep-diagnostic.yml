name: Mobile Connection Deep Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-connection-diagnostic-trigger.txt'
      - '.github/scripts/mobile-connection-deep-diagnostic.sh'
      - '.github/scripts/mobile-connection-runtime-diagnostic.sh'
      - 'pro_repair_v3.py'
      - 'mobile_connection_real_fix.py'
      - 'activity_fixed.kt'

permissions:
  contents: read

env:
  ANDROID_ADB_SERVER_PORT: "5037"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static A-Z diagnostic
        shell: bash
        run: |
          bash .github/scripts/mobile-connection-deep-diagnostic.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator"

      - name: Build APK in disposable CI workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 preflight_patch.py
          python3 mobile_connection_real_fix.py
          python3 pro_repair_v3.py
          test -s KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk
          mkdir -p artifact
          cp KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk artifact/KUNAL_UNIVERSAL_VIDEO_PRO_V3.apk

      - name: Start emulator and run real Stage 2 diagnostic
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -no-metrics -camera-back none -memory 3072
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/mobile-connection-runtime-diagnostic.sh

      - name: Upload complete A-Z evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-connection-deep-diagnostic-${{ github.run_id }}
          path: |
            mobile_connection_deep_diagnostic.txt
            mobile_connection_runtime_diagnostic.txt
            e2e-stage2-*.xml
            e2e-stage2-logcat.txt
            accessibility-dumpsys*.txt
            package-dumpsys.txt
            services-dumpsys.txt
            secure-settings.txt
          if-no-files-found: warn
